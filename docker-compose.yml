services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:18-alpine
    container_name: nyx-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}      # <--- Mengambil dari .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # <--- Mengambil dari .env
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nyx-net

  # 2. Redis Cache
  redis:
    image: redis:alpine
    container_name: nyx-redis
    restart: always
    networks:
      - nyx-net

  # 3. Backend (API)
  server:
    build: ./server
    container_name: nyx-api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      # Gunakan nama service docker ('postgres') sebagai hostname
      DATABASE_URL: ${DATABASE_URL} 
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    networks:
      - nyx-net

  # 4. Relay OHTTP proses terpisah (docs/37 §37.4 P7, docs/10 §10.18).
  #    Klien memakai `/api/ohttp/relay` (nginx → service ini → gateway di API).
  #    `OHTTP_GATEWAY_TRUSTED_HOSTS=server` adalah SATU-SATUNYA alasan relay mau
  #    meneruskan ke host non-loopback; jangan longgarkan tanpa memahami bahwa
  #    relay yang meneruskan ke sembarang host = open proxy.
  #    Set `OHTTP_RELAY_EXTERNAL=1` di environment `server` agar API berhenti
  #    memasang /api/ohttp/relay sendiri.
  ohttp-relay:
    build: ./server
    container_name: nyx-ohttp-relay
    restart: always
    depends_on:
      - server
    environment:
      OHTTP_GATEWAY_TARGET: http://server:4000/api/ohttp/gateway
      OHTTP_GATEWAY_TRUSTED_HOSTS: server
      OHTTP_RELAY_HOST: 0.0.0.0
      # Bind lebar di jaringan container = disengaja (nginx yang mengekspos).
      OHTTP_RELAY_ALLOW_PUBLIC_BIND: "1"
      OHTTP_RELAY_PORT: 4100
      OHTTP_RELAY_RATE_LIMIT: 120
      NODE_ENV: production
    command: ["pnpm", "run", "relay"]
    networks:
      - nyx-net

  # 5. Frontend (Web + Nginx Reverse Proxy)
  web:
    build: ./web
    container_name: nyx-web
    restart: always
    depends_on:
      - server
    ports:
      - "3000" # Akses aplikasi di http://localhost
    networks:
      - nyx-net
    # Konfigurasi reverse proxy sederhana via docker labels atau nginx config tambahan
    # Agar lebih simpel, kita akan update nginx.conf di Langkah 2 sedikit lagi di bawah

volumes:
  postgres_data:

networks:
  nyx-net:

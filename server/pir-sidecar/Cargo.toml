[package]
name = "nyx-pir-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "NYX PIR sidecar: two-server XOR-PIR with sharding (docs/42)"

[lib]
name = "nyx_pir_sidecar"
path = "src/lib.rs"

[[bin]]
name = "pir-service"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
data-encoding = "2.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
rand = "=0.9.1"
tower = { version = "0.5", features = ["util"] }

packages:
  - web
  - server
  - marketing
  - packages/*

# [SECURITY] Dependabot #229/#230/#233: mysql2 & deepmerge-ts dibawa oleh
# Prisma CLI (dev-only toolchain; runtime NYX pakai Postgres via `postgres`).
# Pin ke versi yang sudah menambal decompression-bomb DoS (mysql2),
# auth-downgrade (mysql2), dan stack exhaustion (deepmerge-ts).
overrides:
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  argon2: true
  esbuild: true
  prisma: true
  puppeteer: set this to true or false
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - supabase

minimumReleaseAgeExclude:
  - serialize-javascript@7.1.2
  - dompurify@3.4.16
  - http-cache-semantics@4.2.1
  - braces@3.0.4
  - source-map-js@1.2.2
  - sharp@0.35.5
  - vite@8.3.3
  - '@vitest/mocker@4.1.12'

name: CI

on:
  pull_request:
  push:
    branches: [main]

# [audit F-15] Permission minimum: CI hanya membaca repo (checkout) + cache.
# Tanpa blok ini setiap job mendapat default repo (bisa tulis) — token GITHUB
# yang lebih luas dari yang dibutuhkan, dan semua action pihak ketiga mewarisi
# izin itu.
permissions:
  contents: read

jobs:
  build:
    name: Build (shared + web + server + marketing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gagal cepat bila artefak WASM (spqr/keytrans) tidak ikut ter-commit atau
      # hash-nya tidak cocok manifest; tanpa artefak itu `pnpm run build` pecah
      # di dalam Vite.
      - name: Guard artefak WASM ter-commit + hash manifest (docs/33 · docs/34)
        run: bash scripts/check-wasm-artifacts.sh
      # Gagal cepat bila sumber Signal ter-vendor (vendor/signal, server/kt-query/vendor)
      # hilang/basi/tidak ter-commit — tanpa itu clone bersih tidak bisa dibangun
      # dan NOTICE berbohong soal apa yang didistribusikan (pin vs isi).
      - name: Guard sumber Signal ter-vendor (NOTICE · docs/30 §30.2)
        run: bash scripts/check-vendor.sh
      # Bukti bahwa modul Go yang di-vendor benar-benar membangun & lulus test
      # tanpa checkout upstream (vendor mode, tanpa `replace`).
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/kt-query/go.mod
          cache-dependency-path: server/kt-query/go.sum
      - name: Build & test log KT v2 dari vendor (Go)
        working-directory: server/kt-query
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Prisma generate
        working-directory: server
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_db' }}
      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_db' }}
          JWT_SECRET: ci-jwt-secret-not-for-prod
          CSRF_SECRET: ci-csrf-secret
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'

  # [R1 2026-10-15] Provenance artefak WASM: biner yang dikirim ke browser harus
  # bisa dibuktikan berasal dari `vendor/signal/*` yang tertinjau. Job ini
  # membangun ULANG kedua artefak dari sumber ter-vendor di root kanonik
  # (`scripts/wasm-repro-build.sh`) lalu membandingkan hash-nya dengan
  # `packages/wasm-artifacts.json`. Sebelum ini alasan "CI tak bisa membangun"
  # berlaku karena sumber Signal tidak ada di runner; sekarang sumber ada di repo,
  # jadi alasan itu hilang dan verifikasi ini mungkin — dan wajib.
  wasm:
    name: WASM reproducible (rebuild dari vendor + bandingkan hash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain dipin `packages/*/rust-toolchain.toml` (1.95.0); tindakan ini
      # menyiapkan rustup + target wasm32 agar `rustup target add` di build.sh
      # tidak mengunduh dua kali.
      - uses: 'dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8' # ratchet:dtolnay/rust-toolchain@master (2026-10-26)
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      # protoc adalah build-dependency `spqr` & `keytrans-v2` (prost-build).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rebuild dari vendor + verifikasi hash manifest
        run: bash scripts/wasm-repro-build.sh --verify

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Build shared package
        run: pnpm --filter @nyx/shared run build
      - name: Prisma generate
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_db' }}
        run: pnpm exec prisma generate
      - name: Run unit tests
        run: pnpm run test
        env:
          JWT_SECRET: ci-jwt-secret-not-for-prod
          # Modul server mengimpor src/lib/prisma.ts saat load; tanpa URL ini
          # PrismaClient melempar sebelum test sempat memakai fake DB.
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_db' }}

  pir-sidecar:
    name: PIR sidecar (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8' # ratchet:dtolnay/rust-toolchain@master (2026-10-26)
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Format
        working-directory: server/pir-sidecar
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: server/pir-sidecar
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: server/pir-sidecar
        run: cargo test --locked

  sidecar:
    # [audit F-12 2026-10-26] Clippy akhirnya dijalankan di CI. Sebelum ini
    # tidak ada job yang memeriksanya (hanya `cargo test` di `e2e-chrome`), dan
    # `cargo clippy --all-targets -- -D warnings` ternyata merah: 3 lint di
    # `fuzz.rs`/`protocol.rs` plus `while_let_loop`/`items_after_test_module` di
    # `main.rs`. Kode protokol murni (`protocol.rs`, `fuzz.rs`) adalah yang
    # dijalankan fuzz 1 jam, jadi regresi di sana harus terlihat per-PR.
    # [audit F-12 2026-10-27] `cargo fmt --check` juga dijadikan gate di sini,
    # persis seperti job `pir-sidecar`, setelah crate ini di-rustfmt-kan sekali
    # (57 hunk lama). Tanpa gate, satu-satunya crate Rust yang tidak diformat
    # otomatis kembali kacau dan diff review jadi bising.
    name: Transport sidecar (Rust — fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8' # ratchet:dtolnay/rust-toolchain@master (2026-10-26)
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Format
        working-directory: server/transport-sidecar
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        working-directory: server/transport-sidecar
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (protokol murni + fuzz deterministik)
        working-directory: server/transport-sidecar
        run: cargo test

  lint:
    # [2026-10-11, diperbarui 2026-10-14] Lint BLOCKING lewat oxlint (Rust; tidak
    # terikat versi TS). Rule level error = kelas bug/keamanan (no-eval,
    # no-new-func, no-async-promise-executor, no-unsafe-negation, dll) dan harus 0.
    # Kategori `correctness` **sudah `error`** (gate M7 `docs/30` §30.15 terpenuhi:
    # `correctness` bersih, 0 error). Sisa temuan adalah `no-unused-vars` yang
    # sengaja tetap `warn` (193) dan dibersihkan bertahap; jangan naikkan rule itu
    # ke error sebelum angkanya 0, atau CI jadi merah terus dan diabaikan.
    name: Lint (oxlint — rule error blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Lint
        run: pnpm run lint
      - name: PQ-only guard
        run: node scripts/check-pq-only.mjs
      # STATUS.md hanya boleh berisi fakta yang bisa dibuktikan dari kode
      # (versi, kapabilitas relay, rute privasi, saklar privasi). Dokumen naratif
      # merujuk ke sana; tanpa gate ini tabel status kembali basi seperti
      # `docs/29` sebelum ditulis ulang.
      - name: STATUS.md drift guard
        run: pnpm run check:status

  alerts:
    # [docs/30 WS-G(2)] DRILL alert (gate): aturan Prometheus harus terbukti bisa
    # MENYALA, bukan cuma kompilasi. `promtool test rules` menjalankan kasus
    # sintetis per aturan; lapis kontrak metrik menolak aturan yang merujuk nama
    # metrik yang tidak dideklarasikan (aturan seperti itu diam selamanya), dan
    # lapis cakupan menolak aturan baru yang belum punya kasus drill.
    # Lapis scrape-nyata (`METRICS_URL`) dijalankan di job `e2e` yang sudah punya
    # Postgres + Redis + API hidup.
    name: Alerts (drill promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drill alert (promtool diunduh skrip sendiri, dipin 3.15.0)
        run: SKIP_LIVE=1 bash scripts/drill-alerts.sh

  dr-oracle:
    # [docs/30 WS-G(6)] Vektor lintas-implementasi DR/X3DH. Oracle (`tools/dr-oracle`)
    # adalah implementasi KEDUA tanpa libsodium (circl + x/crypto). Job ini:
    #   1. `go vet`/`go test` oracle,
    #   2. gate DRIFT: vektor ter-commit harus identik dengan hasil regenerasi
    #      (kalau tidak, NYX dan vektor bisa menyimpang diam-diam),
    #   3. menjalankan test NYX vs vektor + test interop dua arah (NYX→oracle).
    name: DR oracle (vektor + interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dr-oracle/go.mod
          cache-dependency-path: tools/dr-oracle/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Oracle — build, vet, unit
        working-directory: tools/dr-oracle
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Gate drift vektor (oracle vs berkas ter-commit)
        working-directory: tools/dr-oracle
        run: go run . -check
      - name: Build shared package
        run: pnpm --filter @nyx/shared run build
      - name: Vektor NYX↔oracle + interop dua arah
        working-directory: web
        run: pnpm exec vitest run src/lib/__tests__/x3dhOracleVectors.test.ts src/lib/__tests__/x3dhOracleInterop.test.ts

  kt-recovery-v2:
    # [docs/39 §39.5] Drill pemulihan log KT **v2** (11 langkah): tulis lewat jalur
    # penulis produksi → snapshot terverifikasi → bencana → pulih HANYA dari
    # arsip → bukti lolos `transparency.VerifySearch` dengan anchor lama → log
    # tumbuh tanpa percabangan, plus 4 kontrol negatif dan skenario rollback.
    #
    # Menggantikan job `kt-recovery` (v1) yang dihapus 2026-10-28 (docs/38).
    # Tidak butuh layanan eksternal: workspace di /tmp, port 18087–18089/19468,
    # kunci acak per jalannya drill, dan binary dibangun ke `$WORK/bin` (tidak
    # pernah menimpa binary layanan hidup).
    name: KT v2 recovery drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/kt-query/go.mod
          cache-dependency-path: server/kt-query/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # `@nyx/shared` dikonsumsi dari dist/; writer drill memakainya lewat
      # `server/src/utils/keyTransparency.ts`.
      - name: Build shared package
        run: pnpm --filter @nyx/shared run build
      - name: Drill pemulihan KT v2
        run: bash scripts/kt-v2-restore-drill.sh

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Audit production dependencies
        run: pnpm audit --prod
      # [audit F-08] Pin transitif harus di `overrides:` (bukan `resolutions`
      # yang diabaikan pnpm) dan benar-benar muncul di lockfile.
      - name: Overrides pnpm berlaku
        run: node scripts/check-overrides.mjs
      # [audit F-15] Tolak action yang di-pin ke ref bergerak (`@master`/`@main`).
      - name: Pin action (tidak ada ref bergerak)
        run: node scripts/check-actions-pins.mjs

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret
      CHAT_SECRET: ci-chat-secret
      TURNSTILE_SECRET_KEY: ''
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Prisma generate + db push (DB CI)
        working-directory: server
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'consent for CI ephemeral database schema push'
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push
      - name: Build shared package
        run: pnpm --filter @nyx/shared run build
      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E (spec transport auto-skip bila WebTransport tidak tersedia)
        working-directory: web
        env:
          # Chromium di runner kini mengekspos WebTransport walau job ini tidak
          # menjalankan sidecar Rust. Paksa fallback WSS agar suite menguji
          # logika aplikasi, bukan menunggu QUIC yang tidak punya uplink.
          VITE_FORCE_WSS: '1'
        run: pnpm exec playwright test --project=chromium
      # [docs/35 §35.9] Build ini PQ-only: `VITE_PQ_V2` sudah tidak berpengaruh
      # dan tidak ada fallback v1. Step terpisah ini tetap ada supaya jalur X3DH
      # v2 / grup `sigV:2` / burner PQ-only punya bukti otomatis; suite utama
      # menguji alur yang sama, bukan default v1.
      - name: Run E2E PQ v2 (PQ-only, tanpa gerbang)
        working-directory: web
        env:
          # Job ini tidak menjalankan sidecar Rust; paksa WSS seperti step E2E
          # utama. Tes burner PQ-only butuh WebTransport nyata dan dijalankan
          # di job `e2e-chrome` (sidecar hidup), bukan di sini.
          VITE_FORCE_WSS: '1'
        run: pnpm exec playwright test --project=chromium e2e/pqV2.spec.ts
      # [docs/35 Fase 8] Gateway OHTTP hanya dipasang saat OHTTP_ENABLED=1, jadi
      # suite utama men-skip spec ini. Step ini menyalakan stack terpisah (API
      # 4100 + Vite 5273, kunci P-256 dibuat saat config dimuat) dan membuktikan
      # pencarian keluar lewat relay berisi amplop — bukan /api/users/search.
      - name: Run E2E OHTTP (gateway nyata, port terpisah)
        working-directory: web
        env:
          VITE_FORCE_WSS: '1'
        run: pnpm exec playwright test --config playwright.ohttp.config.ts --project=chromium
      # [docs/30 WS-G(2)] Lapis "scrape nyata" dari drill alert: exporter hidup di
      # 127.0.0.1:9464 milik proses ini sendiri (Postgres/Redis sudah siap di job
      # ini). Menolak nama metrik yang terkirim tapi tidak dideklarasikan —
      # salah tulis nama = aturan tidak pernah menyala tanpa error apa pun.
      - name: Start API & drill alert terhadap exporter nyata
        working-directory: server
        run: |
          npx tsx src/index.ts > /tmp/nyx-api.live.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9464/metrics >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9464/metrics >/dev/null
          cd .. && PROMTOOL_VERSION=3.15.0 bash scripts/drill-alerts.sh

  e2e-chrome:
    name: E2E (Chrome penuh — WebTransport/QUIC aktif)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret
      CHAT_SECRET: ci-chat-secret
      CORS_ORIGIN: http://localhost:5173
      TRANSPORT_PORT: 33333
      # [docs/30 §30.9 WS-E(1)] coturn self-host: kredensial HMAC time-limited
      # yang diterbitkan `/api/keys/turn`. Tanpa ini `e2e/call.spec.ts` skip
      # dengan alasan tertulis (bukan lulus palsu).
      TURN_URLS: turn:127.0.0.1:3478?transport=udp
      TURN_STATIC_AUTH_SECRET: ci-turn-static-auth-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Build shared package
        run: pnpm --filter @nyx/shared run build
      - name: Prisma generate + db push (DB CI)
        working-directory: server
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'consent for CI ephemeral database schema push'
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push
      - name: Install Google Chrome (channel 'chrome')
        working-directory: web
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Build Rust WebTransport sidecar
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Test sidecar (protokol murni + fuzz deterministik)
        working-directory: server/transport-sidecar
        run: cargo test
      - name: Build sidecar
        working-directory: server/transport-sidecar
        run: cargo build --release
      # [docs/30 §30.9 WS-E gate (1)] gate menerima "E2E call 1:1 di CI chrome
      # dengan coturn", jadi coturn harus benar-benar berjalan di runner ini:
      # peer di loopback → `allow-loopback-peers` wajib (produksi memakai IP
      # publik dan tidak boleh memakainya).
      # coturn resmi via Docker (bukan paket apt runner): versi & config sama
      # dengan resep lokal docs/30 §30.9 yang terbukti merelay. Paket apt bisa
      # bertabrakan dengan unit coturn bawaan, sehingga port 3478 "listen" tapi
      # kredensial HMAC dari server ditolak → 0 kandidat relay.
      - name: Start coturn (TURN self-host untuk e2e/call.spec.ts)
        run: |
          cat > /tmp/turnserver.conf <<EOF
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          use-auth-secret
          static-auth-secret=${TURN_STATIC_AUTH_SECRET}
          realm=nyx.ci
          fingerprint
          no-cli
          no-tls
          no-dtls
          allow-loopback-peers
          log-file=stdout
          EOF
          docker run -d --name nyx-coturn --network host \
            -v /tmp/turnserver.conf:/etc/coturn/turnserver.conf:ro \
            coturn/coturn:4.6-alpine -c /etc/coturn/turnserver.conf
          for i in $(seq 1 20); do
            ss -lun 2>/dev/null | grep -q ':3478' && break
            sleep 1
          done
          ss -lun | grep ':3478'   # gagal keras bila coturn tidak listen
          docker logs --tail 10 nyx-coturn
      - name: Start sidecar & ambil cert hash untuk pinning
        working-directory: server
        run: |
          ./transport-sidecar/target/release/transport-sidecar > /tmp/sidecar.log 2>&1 &
          for i in $(seq 1 20); do
            grep -q "SHA-256 Hash" /tmp/sidecar.log && break
            sleep 1
          done
          CERT_HASH=$(grep -oE "Hash: ([0-9a-f]{2}:){31}[0-9a-f]{2}" /tmp/sidecar.log | head -1 | cut -d' ' -f2)
          echo "VITE_TRANSPORT_CERT_HASH=$CERT_HASH" >> "$GITHUB_ENV"
          echo "VITE_TRANSPORT_URL=http://127.0.0.1:33333" >> "$GITHUB_ENV"
          cat /tmp/sidecar.log
      - name: Run E2E full (chat + transport + call specs aktif)
        working-directory: web
        run: pnpm exec playwright test --project=chrome

      - name: Run E2E PQ v2 burner (WebTransport nyata)
        working-directory: web
        run: pnpm exec playwright test --project=chrome e2e/pqV2.spec.ts -g "burner init PQ-only"

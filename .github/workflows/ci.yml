name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build (shared + web + server + marketing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gagal cepat bila artefak WASM (spqr/keytrans) tidak ikut ter-commit atau
      # hash-nya tidak cocok manifest; tanpa artefak itu `pnpm run build` pecah
      # di dalam Vite.
      - name: Guard artefak WASM ter-commit + hash manifest (docs/33 · docs/34)
        run: bash scripts/check-wasm-artifacts.sh
      # Gagal cepat bila sumber Signal ter-vendor (vendor/signal, server/kt-query/vendor)
      # hilang/basi/tidak ter-commit — tanpa itu clone bersih tidak bisa dibangun
      # dan NOTICE berbohong soal apa yang didistribusikan (pin vs isi).
      - name: Guard sumber Signal ter-vendor (NOTICE · docs/30 §30.2)
        run: bash scripts/check-vendor.sh
      # Bukti bahwa modul Go yang di-vendor benar-benar membangun & lulus test
      # tanpa checkout upstream (vendor mode, tanpa `replace`).
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/kt-query/go.mod
          cache-dependency-path: server/kt-query/go.sum
      - name: Build & test kt-query dari vendor (Go)
        working-directory: server/kt-query
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Prisma generate
        working-directory: server
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_db' }}
      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_db' }}
          JWT_SECRET: ci-jwt-secret-not-for-prod
          CSRF_SECRET: ci-csrf-secret
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'

  # [R1 2026-10-15] Provenance artefak WASM: biner yang dikirim ke browser harus
  # bisa dibuktikan berasal dari `vendor/signal/*` yang tertinjau. Job ini
  # membangun ULANG kedua artefak dari sumber ter-vendor di root kanonik
  # (`scripts/wasm-repro-build.sh`) lalu membandingkan hash-nya dengan
  # `packages/wasm-artifacts.json`. Sebelum ini alasan "CI tak bisa membangun"
  # berlaku karena sumber Signal tidak ada di runner; sekarang sumber ada di repo,
  # jadi alasan itu hilang dan verifikasi ini mungkin — dan wajib.
  wasm:
    name: WASM reproducible (rebuild dari vendor + bandingkan hash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain dipin `packages/*/rust-toolchain.toml` (1.95.0); tindakan ini
      # menyiapkan rustup + target wasm32 agar `rustup target add` di build.sh
      # tidak mengunduh dua kali.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      # protoc adalah build-dependency `spqr` & `libsignal-keytrans` (prost-build).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rebuild dari vendor + verifikasi hash manifest
        run: bash scripts/wasm-repro-build.sh --verify

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Run unit tests
        run: pnpm run test
        env:
          JWT_SECRET: ci-jwt-secret-not-for-prod

  lint:
    # [2026-10-11, diperbarui 2026-10-14] Lint BLOCKING lewat oxlint (Rust; tidak
    # terikat versi TS). Rule level error = kelas bug/keamanan (no-eval,
    # no-new-func, no-async-promise-executor, no-unsafe-negation, dll) dan harus 0.
    # Kategori `correctness` **sudah `error`** (gate M7 `docs/30` §30.15 terpenuhi:
    # `correctness` bersih, 0 error). Sisa temuan adalah `no-unused-vars` yang
    # sengaja tetap `warn` (194) dan dibersihkan bertahap; jangan naikkan rule itu
    # ke error sebelum angkanya 0, atau CI jadi merah terus dan diabaikan.
    name: Lint (oxlint — rule error blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Lint
        run: pnpm run lint

  alerts:
    # [docs/30 WS-G(2)] DRILL alert (gate): aturan Prometheus harus terbukti bisa
    # MENYALA, bukan cuma kompilasi. `promtool test rules` menjalankan kasus
    # sintetis per aturan; lapis kontrak metrik menolak aturan yang merujuk nama
    # metrik yang tidak dideklarasikan (aturan seperti itu diam selamanya), dan
    # lapis cakupan menolak aturan baru yang belum punya kasus drill.
    # Lapis scrape-nyata (`METRICS_URL`) dijalankan di job `e2e` yang sudah punya
    # Postgres + Redis + API hidup.
    name: Alerts (drill promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drill alert (promtool diunduh skrip sendiri, dipin 3.15.0)
        run: SKIP_LIVE=1 bash scripts/drill-alerts.sh

  dr-oracle:
    # [docs/30 WS-G(6)] Vektor lintas-implementasi DR/X3DH. Oracle (`tools/dr-oracle`)
    # adalah implementasi KEDUA tanpa libsodium (circl + x/crypto). Job ini:
    #   1. `go vet`/`go test` oracle,
    #   2. gate DRIFT: vektor ter-commit harus identik dengan hasil regenerasi
    #      (kalau tidak, NYX dan vektor bisa menyimpang diam-diam),
    #   3. menjalankan test NYX vs vektor + test interop dua arah (NYX→oracle).
    name: DR oracle (vektor + interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dr-oracle/go.mod
          cache-dependency-path: tools/dr-oracle/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Oracle — build, vet, unit
        working-directory: tools/dr-oracle
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Gate drift vektor (oracle vs berkas ter-commit)
        working-directory: tools/dr-oracle
        run: go run . -check
      - name: Vektor NYX↔oracle + interop dua arah
        working-directory: web
        run: pnpm exec vitest run src/lib/__tests__/x3dhOracleVectors.test.ts src/lib/__tests__/x3dhOracleInterop.test.ts

  kt-recovery:
    # [docs/10 §10.13 · docs/32 §32.7 · docs/34 §34.6b] DRILL pemulihan log KT:
    # entri ditulis lewat penulis produksi → snapshot terverifikasi → basis data
    # hidup DIHAPUS → pulih hanya dari arsip → tree size + root harus identik dan
    # bukti harus tetap lolos `transparency.VerifySearch` (kode upstream yang sama
    # dengan WASM klien), lalu log harus bisa tumbuh tanpa memutus anchor klien
    # pra-bencana. Kontrol negatif di akhir memastikan pemeriksanya bisa gagal.
    name: KT recovery drill (snapshot → bencana → pulih)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/kt-query/go.mod
          cache-dependency-path: server/kt-query/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Go — vet + test kt-query (termasuk pemeriksa nyx-kt-check)
        working-directory: server/kt-query
        run: |
          go vet ./...
          go test ./...
      - name: Drill pemulihan dari arsip snapshot
        run: bash scripts/kt-restore-drill.sh

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Audit production dependencies
        run: pnpm audit --prod

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret
      CHAT_SECRET: ci-chat-secret
      TURNSTILE_SECRET_KEY: ''
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Prisma generate + db push (DB CI)
        working-directory: server
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'consent for CI ephemeral database schema push'
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push
      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E (spec transport auto-skip bila WebTransport tidak tersedia)
        working-directory: web
        run: pnpm exec playwright test --project=chromium
      # [docs/30 WS-G(2)] Lapis "scrape nyata" dari drill alert: exporter hidup di
      # 127.0.0.1:9464 milik proses ini sendiri (Postgres/Redis sudah siap di job
      # ini). Menolak nama metrik yang terkirim tapi tidak dideklarasikan —
      # salah tulis nama = aturan tidak pernah menyala tanpa error apa pun.
      - name: Start API & drill alert terhadap exporter nyata
        working-directory: server
        run: |
          npx tsx src/index.ts > /tmp/nyx-api.live.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9464/metrics >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9464/metrics >/dev/null
          cd .. && PROMTOOL_VERSION=3.15.0 bash scripts/drill-alerts.sh

  e2e-chrome:
    name: E2E (Chrome penuh — WebTransport/QUIC aktif)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret
      CHAT_SECRET: ci-chat-secret
      CORS_ORIGIN: http://localhost:5173
      TRANSPORT_PORT: 33333
      # [docs/30 §30.9 WS-E(1)] coturn self-host: kredensial HMAC time-limited
      # yang diterbitkan `/api/keys/turn`. Tanpa ini `e2e/call.spec.ts` skip
      # dengan alasan tertulis (bukan lulus palsu).
      TURN_URLS: turn:127.0.0.1:3478?transport=udp
      TURN_STATIC_AUTH_SECRET: ci-turn-static-auth-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies (lockfile enforced)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Prisma generate + db push (DB CI)
        working-directory: server
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'consent for CI ephemeral database schema push'
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push
      - name: Install Google Chrome (channel 'chrome')
        working-directory: web
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Build Rust WebTransport sidecar
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Test sidecar (protokol murni + fuzz deterministik)
        working-directory: server/transport-sidecar
        run: cargo test
      - name: Build sidecar
        working-directory: server/transport-sidecar
        run: cargo build --release
      # [docs/30 §30.9 WS-E gate (1)] gate menerima "E2E call 1:1 di CI chrome
      # dengan coturn", jadi coturn harus benar-benar berjalan di runner ini:
      # peer di loopback → `allow-loopback-peers` wajib (produksi memakai IP
      # publik dan tidak boleh memakainya).
      - name: Install coturn (TURN self-host untuk e2e/call.spec.ts)
        run: sudo apt-get update && sudo apt-get install -y coturn
      - name: Start coturn
        run: |
          sudo tee /etc/turnserver.conf >/dev/null <<EOF
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          use-auth-secret
          static-auth-secret=${TURN_STATIC_AUTH_SECRET}
          realm=nyx.ci
          fingerprint
          no-cli
          no-tls
          no-dtls
          allow-loopback-peers
          log-file=stdout
          EOF
          sudo turnserver -c /etc/turnserver.conf > /tmp/coturn.log 2>&1 &
          for i in $(seq 1 20); do
            ss -lun 2>/dev/null | grep -q ':3478' && break
            sleep 1
          done
          ss -lun | grep ':3478'   # gagal keras bila coturn tidak listen
          tail -5 /tmp/coturn.log
      - name: Start sidecar & ambil cert hash untuk pinning
        working-directory: server
        run: |
          ./transport-sidecar/target/release/transport-sidecar > /tmp/sidecar.log 2>&1 &
          for i in $(seq 1 20); do
            grep -q "SHA-256 Hash" /tmp/sidecar.log && break
            sleep 1
          done
          CERT_HASH=$(grep -oE "Hash: ([0-9a-f]{2}:){31}[0-9a-f]{2}" /tmp/sidecar.log | head -1 | cut -d' ' -f2)
          echo "VITE_TRANSPORT_CERT_HASH=$CERT_HASH" >> "$GITHUB_ENV"
          echo "VITE_TRANSPORT_URL=http://localhost:33333" >> "$GITHUB_ENV"
          cat /tmp/sidecar.log
      - name: Run E2E full (chat + transport + call specs aktif)
        working-directory: web
        run: pnpm exec playwright test --project=chrome

name: Deploy NYX to VPS (PNPM Monorepo)

on:
  workflow_dispatch:

# [audit F-15] Permission minimum. Deploy hanya membaca repo di runner; semua
# akses VPS lewat SSH milik step sendiri, bukan token GITHUB.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      # Gagal cepat sebelum build: artefak WASM (spqr/keytrans) tidak dibangun di
      # CI, jadi kalau tidak ter-commit `pnpm --filter nyx-web run build` pecah.
      - name: 🛡️ Guard artefak WASM ter-commit (docs/33 · docs/34)
        run: bash scripts/check-wasm-artifacts.sh

      # Gagal cepat bila sumber Signal ter-vendor tidak ikut ter-commit: deploy
      # mengirim zip tanpa checkout Signal, jadi `vendor/` yang hilang membuat
      # artefak yang dikirim tidak bisa dibangun ulang dari repo (NOTICE memuat
      # pin-nya).
      - name: 🛡️ Guard sumber Signal ter-vendor (NOTICE · docs/30 §30.2)
        run: bash scripts/check-vendor.sh

      # --- SETUP PNPM ---
      - name: Install pnpm manually (Bypass GitHub Outage)
        run: npm install -g pnpm@11.4.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: 🦀 Setup Rust (Untuk WebTransport Sidecar)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # --- PHASE 1: INSTALL SEMUA (ROOT) ---
      - name: 📦 Install Dependencies (Root)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # --- PHASE 2: BUILD SHARED PACKAGE ---
      - name: 🏗️ Build Shared Package
        run: pnpm --filter @nyx/shared run build

      - name: 🔐 Assert Required Secrets
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::error::VITE_TURNSTILE_SITE_KEY secret is missing or empty!"
            exit 1
          fi

      # --- PHASE 3: BUILD WEB ---
      - name: 🎨 Build Web (Frontend)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TRANSPORT_URL: ${{ secrets.VITE_TRANSPORT_URL }}
          VITE_APP_SECRET: ${{ secrets.VITE_APP_SECRET }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: pnpm --filter nyx-web run build

      - name: 🚀 Build Marketing (Sisi Publik)
        run: pnpm --filter ./marketing run build

      # --- PHASE 4: BUILD SERVER ---
      - name: ⚙️ Build Server (Backend)
        run: |
          pnpm --filter nyx-server exec prisma generate
          pnpm --filter nyx-server run build

      - name: 🦀 Build Rust WebTransport Sidecar
        run: |
          cd server/transport-sidecar
          cargo build --release

      # Binary layanan log Key Transparency v2 (`nyx-kt-query-v2` + auditor v2 +
      # bootstrap, Go) — dibangun dari `vendor/`, jadi tidak ada unduhan saat build
      # (repo upstream Signal privat). Deploy yang mengirim binary-nya supaya
      # pembaruan layanan KT bukan lagi langkah manual: unit + catatan pemasangan
      # ada di `ops/systemd/`. Log v1 sudah pensiun (`docs/38`), jadi binari v1
      # tidak lagi dibangun.
      - name: 🐹 Setup Go (nyx-kt-query-v2)
        uses: actions/setup-go@v5
        with:
          go-version-file: server/kt-query/go.mod
          cache-dependency-path: server/kt-query/go.sum

      - name: 🐹 Build nyx-kt-query-v2 (Go, dari vendor)
        run: bash server/kt-query/build.sh

      # --- PHASE 5: PACKAGING ---
      - name: 🗜️ Prepare Artifacts for Deploy
        run: |
          mkdir deploy_package

          cp package.json pnpm-workspace.yaml pnpm-lock.yaml deploy_package/
          mkdir -p deploy_package/packages/shared
          cp packages/shared/package.json deploy_package/packages/shared/
          cp -r packages/shared/dist deploy_package/packages/shared/
          
          # Copy Frontend Build
          mkdir -p deploy_package/web
          cp -r web/dist deploy_package/web/

          mkdir -p deploy_package/marketing
          cp -r marketing/dist deploy_package/marketing/
          
          # Copy Backend (Bawa Prisma hasil generate dari GitHub, TAPI TINGGALKAN node_modules)
          mkdir -p deploy_package/server
          cp -r server/src deploy_package/server/
          cp server/tsconfig.json deploy_package/server/
          cp -r server/dist deploy_package/server/
          cp server/package.json deploy_package/server/
          cp -r server/prisma deploy_package/server/

          # Bawa binary Rust
          mkdir -p deploy_package/server/transport-sidecar/target/release
          cp server/transport-sidecar/target/release/transport-sidecar deploy_package/server/transport-sidecar/target/release/

          # Bawa binary Go layanan log KT v2 (`nyx-kt-query-v2`, `nyx-kt-auditor-v2`,
          # `nyx-kt-v2-init`) dan seluruh `ops/systemd/` (unit + template
          # EnvironmentFile + catatan pemasangan), supaya VPS tidak perlu menyalin
          # manual dari repo. Binari v1 tidak lagi dibangun maupun dikirim.
          #
          # Guard: unit systemd dan langkah deploy harus menunjuk path binary yang
          # SAMA. Kalau tidak, deploy akan menyalin binary ke satu tempat sementara
          # unit menjalankan tempat lain — dan kegagalannya hanya terlihat sebagai
          # "nyx-kt-query-v2 gagal start" di VPS, bukan di sini.
          [ -x server/kt-query/nyx-kt-query-v2 ] || { echo "::error::binary nyx-kt-query-v2 tidak terbangun (build.sh gagal?)"; exit 1; }
          [ -x server/kt-query/nyx-kt-auditor-v2 ] || { echo "::error::binary nyx-kt-auditor-v2 tidak terbangun (build.sh gagal?)"; exit 1; }
          [ -x server/kt-query/nyx-kt-v2-init ] || { echo "::error::binary nyx-kt-v2-init tidak terbangun (build.sh gagal?)"; exit 1; }
          grep -q 'ExecStart=/root/nyx-app/server/kt-query/nyx-kt-query-v2 ' ops/systemd/nyx-kt-query-v2.service \
            || { echo "::error::ops/systemd/nyx-kt-query-v2.service tidak menunjuk /root/nyx-app/server/kt-query/nyx-kt-query-v2 — samakan unit dengan langkah deploy"; exit 1; }
          grep -q 'ExecStart=/root/nyx-app/server/kt-query/nyx-kt-auditor-v2' ops/systemd/nyx-kt-auditor-v2.service \
            || { echo "::error::ops/systemd/nyx-kt-auditor-v2.service tidak menunjuk /root/nyx-app/server/kt-query/nyx-kt-auditor-v2 — samakan unit dengan langkah deploy"; exit 1; }
          mkdir -p deploy_package/server/kt-query
          cp server/kt-query/nyx-kt-query-v2 server/kt-query/nyx-kt-auditor-v2 \
             server/kt-query/nyx-kt-v2-init deploy_package/server/kt-query/
          mkdir -p deploy_package/ops
          cp -r ops/systemd deploy_package/ops/
          
          cd deploy_package
          zip -r ../nyx-deploy.zip .

      # --- PHASE 5: SHIP TO VPS ---
      # TODO(OPS): Migrasi ke SSH key (secrets.VPS_SSH_KEY) — password auth rentan brute-force.
      - name: 🚀 Upload to VPS via SCP
        # [audit F-15] Dulu `@master`: kode yang memegang kunci SSH bisa berubah
        # tanpa perubahan di repo. Di-pin ke SHA v1.0.0.
        uses: 'appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345' # ratchet:appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "nyx-deploy.zip"
          target: "/root/"

      # --- PHASE 6: EXECUTE ON VPS (PNPM NATIVE INSTALL) ---
      - name: 🔧 Unzip & Restart on VPS
        uses: 'appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2' # ratchet:appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e  # Exit on error
            echo "🚧 Starting Deployment (Barbaric Direct Overwrite Mode)..."
            
            # 1. Pastikan PNPM terinstall di VPS
            if ! command -v pnpm &> /dev/null; then
                npm install -g pnpm@11.4.0
            fi
            
            pm2 stop nyx-api nyx-sidecar || true

            
            # 2. Siapkan direktori utama (Jika belum ada)
            TARGET_DIR="/root/nyx-app"
            mkdir -p $TARGET_DIR

            # Simpan binary KT dari deploy sebelumnya untuk rollback cepat — harus
            # SEBELUM zip menimpanya (ops/systemd/README.md).
            if [ -f "$TARGET_DIR/server/kt-query/nyx-kt-query-v2" ]; then
                cp -f "$TARGET_DIR/server/kt-query/nyx-kt-query-v2" "$TARGET_DIR/server/kt-query/nyx-kt-query-v2.prev"
            fi

            rm -rf $TARGET_DIR/server/dist
            rm -rf $TARGET_DIR/server/src
            rm -rf $TARGET_DIR/web
            rm -rf $TARGET_DIR/marketing

            
            # 3. Unzip dan TIMPA LANGSUNG ke direktori utama
            echo "📦 Unzipping artifact directly to $TARGET_DIR..."
            unzip -q -o /root/nyx-deploy.zip -d $TARGET_DIR/
            rm /root/nyx-deploy.zip
            
            # 4. INSTALL DI VPS PAKAI PNPM (Di Root Monorepo)
            echo "📦 Installing backend dependencies with PNPM..."
            if [ ! -f "$TARGET_DIR/server/.env" ]; then
                cp $TARGET_DIR/.env $TARGET_DIR/server/.env || true
            fi
            if [ ! -f "$TARGET_DIR/server/ca.pem" ]; then
                cp $TARGET_DIR/ca.pem $TARGET_DIR/server/ca.pem || true
            fi
            cd $TARGET_DIR
            PUPPETEER_SKIP_DOWNLOAD="true" CI=true pnpm install --frozen-lockfile

            # Pastikan file rahasia diamankan (Diasumsikan Anda menaruh .env asli di /root/nyx-app/.env)
            if [ -f "$TARGET_DIR/.env" ]; then
                cp $TARGET_DIR/.env $TARGET_DIR/server/.env
            else
                echo "⚠️ WARNING: File .env server Production tidak ditemukan di root aplikasi! Pastikan DATABASE_URL & JWT_SECRET sudah ada di .env"
            fi
            
            # 5. GENERATE PRISMA ENGINE + SYNC SCHEMA (Wajib di dalam server/)
            echo "⚙️ Generating Prisma Engine..."
            cd $TARGET_DIR/server
            pnpm exec prisma generate
            # [audit F-04] Skema yang gagal disinkronkan = build ini tidak bisa
            # jalan (kolom wajib baru → discovery grup & otorisasi admin mati).
            # Dulu `|| true` membuat deploy HIJAU dengan DB lama; sekarang push
            # yang gagal menghentikan deploy SEBELUM pm2 restart, sehingga proses
            # lama tetap melayani sampai skemanya benar.
            echo "🗄️ Syncing Prisma schema (additive; failure aborts the deploy)..."
            if ! PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION="consent for production schema sync via deploy workflow" pnpm exec prisma db push; then
              echo "::error::prisma db push gagal — skema DB tidak cocok dengan build ini; pm2 TIDAK direstart"
              exit 1
            fi

            # [audit F-04] `db push` sukses bukan bukti kolomnya ada. Verifikasi
            # langsung ke information_schema untuk kolom/tabel yang dipakai build
            # ini; jangan biarkan klien baru menemukannya lewat query 500.
            echo "🔎 Verifikasi skema yang dibutuhkan build ini (fail-closed)..."
            # Ditulis DI DALAM server/ (bukan /tmp): resolusi ESM `pg`/`dotenv`
            # mengikuti lokasi berkas, bukan cwd — skrip di /tmp tidak akan
            # menemukan node_modules monorepo.
            cat > $TARGET_DIR/server/nyx-verify-schema.mjs <<'NYX_SCHEMA'
            import 'dotenv/config';
            import { Pool } from 'pg';

            const raw = process.env.DIRECT_URL || process.env.DATABASE_URL;
            if (!raw) {
              console.error('::error::DIRECT_URL/DATABASE_URL kosong di server/.env — tidak bisa memverifikasi skema');
              process.exit(1);
            }
            // Sama dengan lib/prisma.ts: DB lokal (VPS) plaintext, host lain TLS.
            const isLocal = /(^|@)(localhost|127\.0\.0\.1)(:|$|\/)/i.test(raw);
            const url = isLocal ? raw : `${raw}${raw.includes('?') ? '&' : '?'}sslmode=require`;

            const REQUIRED = [
              ['UserHiddenConversation', 'tokenHash'],
              ['UserHiddenConversation', 'tokenEpoch'],
              ['Conversation', 'adminSecretHash'],
              ['GroupMailboxItem', 'id'],
            ];

            const pool = new Pool({ connectionString: url });
            try {
              for (const [table, column] of REQUIRED) {
                const { rows } = await pool.query(
                  'SELECT 1 FROM information_schema.columns WHERE table_name = $1 AND column_name = $2 LIMIT 1',
                  [table, column],
                );
                if (rows.length === 0) {
                  console.error(`::error::skema DB tidak cocok: ${table}.${column} tidak ada — deploy dihentikan sebelum pm2 restart`);
                  process.exit(1);
                }
              }
              console.log('✅ Skema terverifikasi: tokenHash, tokenEpoch, adminSecretHash, GroupMailboxItem');
            } finally {
              await pool.end();
            }
            NYX_SCHEMA
            node $TARGET_DIR/server/nyx-verify-schema.mjs
            rm -f $TARGET_DIR/server/nyx-verify-schema.mjs
            
            # 6. DEPLOY FRONTEND
            echo "🌐 Deploying Frontend..."
            sudo mkdir -p /var/www/nyx-web
            # Hapus isi lama, copy yang baru
            sudo rm -rf /var/www/nyx-web/*
            sudo cp -r $TARGET_DIR/web/dist/* /var/www/nyx-web/

            echo "🌐 Deploying Marketing Frontend..."
            sudo mkdir -p /var/www/nyx-marketing
            sudo rm -rf /var/www/nyx-marketing/*
            sudo cp -r $TARGET_DIR/marketing/dist/* /var/www/nyx-marketing/
            sudo systemctl reload nginx || true
            
            # 7. RESTART PM2 (Bersih dan Langsung)
            echo "🚀 Restarting API..."
            
            # [audit F-02] NODE_ENV=production mengaktifkan semua yang selama ini
            # hanya ada di dokumen: cookie sesi `Secure`, CSP/HSTS produksi,
            # penolakan boot untuk JWT_SECRET dev, dan mematikan access log
            # morgan yang mencetak URL+query. Konsekuensinya config.ts bisa
            # menolak boot → pm2 crash-loop, jadi rahasia diperiksa DULU, sebelum
            # proses lama dihapus. Deploy yang gagal di sini tidak menghilangkan
            # layanan yang sedang jalan.
            echo "🔐 Verifikasi rahasia produksi sebelum restart..."
            node --input-type=module -e "
            import 'dotenv/config';
            const jwt = (process.env.JWT_SECRET || '').trim();
            const csrf = (process.env.CSRF_SECRET || '').trim();
            const cookieDomain = (process.env.COOKIE_DOMAIN || '').trim();
            if (!jwt || jwt === 'dev-secret' || jwt.length < 32) {
              console.error('::error::JWT_SECRET kosong/placeholder/<32 karakter — NODE_ENV=production akan crash-loop');
              process.exit(1);
            }
            if (!csrf) console.warn('⚠️  CSRF_SECRET kosong: jatuh ke JWT_SECRET (tidak fail-closed, tapi rahasia terpisah lebih baik).');
            if (!cookieDomain) console.warn('⚠️  COOKIE_DOMAIN kosong: cookie host-only — gateway realtime di host lain akan menolak sesi.');
            console.log('✅ JWT_SECRET lolos guard produksi.');
            "
            # Verifikasi di atas membaca `server/.env` (dotenv, cwd = server/) —
            # file yang sama yang dipakai proses nyx-api setelah restart, karena
            # langkah 4 menyalin `$TARGET_DIR/.env` ke `server/.env`.

            # Hapus proses lama biar memori PM2 benar-benar bersih
            pm2 delete nyx-api nyx-sidecar || true
            
            echo "🚀 Starting Node.js API..."
            NODE_ENV=production pm2 start $TARGET_DIR/server/dist/index.js \
              --name "nyx-api" \
              -i max \
              --node-args="--max-old-space-size=1024" \
              --cwd $TARGET_DIR/server

            echo "🦀 Starting Rust WebTransport Sidecar..."
            chmod +x $TARGET_DIR/server/transport-sidecar/target/release/transport-sidecar
            pm2 start $TARGET_DIR/server/transport-sidecar/target/release/transport-sidecar \
              --name "nyx-sidecar" \
              --cwd $TARGET_DIR/server
              
            pm2 save --force

            # Target scrape per-worker. pm2 `-i max` menentukan jumlah worker;
            # script memakai jumlah CPU host. METRICS_PORT=0 menulis daftar kosong.
            if [ -d /etc/prometheus ]; then
              METRICS_BASE=$(grep -E '^METRICS_PORT=' "$TARGET_DIR/server/.env" | tail -n1 | cut -d= -f2- | tr -d '"' || true)
              node "$TARGET_DIR/scripts/metrics-targets.mjs" \
                --base "${METRICS_BASE:-9464}" \
                --out /etc/prometheus/file_sd/nyx-api.json
            else
              echo "ℹ️  /etc/prometheus tidak ada — target metrics tidak dibuat."
            fi

            # 7b. PENSIUNAN KT v1 (docs/38) — unit `nyx-kt-query` dan
            #     `nyx-kt-auditor` sudah tidak ada di repo. Bila VPS masih
            #     menjalankannya, hentikan lalu hapus unit-nya: proses v1 tidak
            #     boleh terus menulis/melayani pohon yang sudah mati. LevelDB v1
            #     TIDAK dihapus di sini (arsip/rollback operator, docs/39).
            KT_DIR="$TARGET_DIR/server/kt-query"
            for OLD_UNIT in nyx-kt-query nyx-kt-auditor; do
                if systemctl is-enabled --quiet "$OLD_UNIT" 2>/dev/null; then
                    systemctl disable --now "$OLD_UNIT" || true
                    echo "⏹️  $OLD_UNIT (KT v1) dihentikan — log v1 dipensiunkan"
                fi
                if [ -f "/etc/systemd/system/$OLD_UNIT.service" ]; then
                    rm -f "/etc/systemd/system/$OLD_UNIT.service"
                fi
            done
            systemctl daemon-reload

            # 8. LOG KT v2 (`nyx-kt-query-v2`) — service terpisah dengan LevelDB
            #     sendiri. Pemasangan pertama (config + kunci ML-DSA + direktori)
            #     dijalankan otomatis di sini bila config belum ada: kunci lahir
            #     di VPS, tidak pernah melewati CI. Config yang sudah ada TIDAK
            #     pernah ditimpa (mengganti signing-key = semua bukti lama mati).
            #
            #     Sejak 2026-10-28 layanan ini **satu-satunya** log KT: penulisan v1
            #     dihapus dan `KT_QUERY_URL` menunjuk v2 (docs/38). Pemasangan
            #     pertama tetap otomatis bila config belum ada; config yang sudah ada
            #     tidak pernah ditimpa.
            echo "🔏 Deploying Key Transparency service v2 (nyx-kt-query-v2)..."
            KT_V2_BIN="$KT_DIR/nyx-kt-query-v2"
            KT_V2_INIT="$KT_DIR/nyx-kt-v2-init"
            KT_V2_UNIT="$TARGET_DIR/ops/systemd/nyx-kt-query-v2.service"
            if [ -f "$KT_V2_UNIT" ]; then
                install -m 644 "$KT_V2_UNIT" /etc/systemd/system/nyx-kt-query-v2.service
                install -m 644 "$TARGET_DIR/ops/systemd/nyx-kt-auditor-v2.service" /etc/systemd/system/nyx-kt-auditor-v2.service
                systemctl daemon-reload
            fi
            if [ -f "$KT_V2_UNIT" ] && [ ! -f /etc/nyx/kt-v2/config.yaml ]; then
                if [ ! -x "$KT_V2_INIT" ]; then
                    echo "::error::binary nyx-kt-v2-init tidak ada di $KT_V2_INIT — bootstrap log v2 tidak bisa dijalankan"
                    exit 1
                fi
                echo "🔑 Bootstrap log KT v2 (kunci ML-DSA lahir di VPS ini)..."
                "$KT_V2_INIT" -config-dir /etc/nyx/kt-v2 -db /var/lib/nyx/kt-v2/tree.db
                install -d -m 700 /var/lib/nyx/kt-v2 /var/lib/nyx/kt-v2-snapshots /var/lib/nyx/kt-auditor-v2
                [ -f /etc/nyx/kt-v2/nyx-kt-query.env ] \
                    || install -m 600 "$TARGET_DIR/ops/systemd/nyx-kt-query-v2.env.example" /etc/nyx/kt-v2/nyx-kt-query.env
                [ -f /etc/nyx/kt-v2/nyx-kt-auditor.env ] \
                    || install -m 600 "$TARGET_DIR/ops/systemd/nyx-kt-auditor-v2.env.example" /etc/nyx/kt-v2/nyx-kt-auditor.env
                echo "✅ Config, kunci log, dan kunci auditor v2 dibuat"
            fi
            if [ -f "$KT_V2_UNIT" ] && [ -f /etc/nyx/kt-v2/config.yaml ]; then
                systemctl enable nyx-kt-query-v2 nyx-kt-auditor-v2
                # Penulisan log KT v2: endpoint yang sama dengan `-write-addr` unit.
                # Hanya ditambahkan sekali; nilai operator tidak ditimpa.
                if [ -f "$TARGET_DIR/.env" ] && ! grep -q '^KT_V2_SERVER_URL=' "$TARGET_DIR/.env"; then
                    printf '\n# [docs/35 §35.7] Log Key Transparency v2 (ML-DSA); satu-satunya log sejak docs/38.\nKT_V2_SERVER_URL=http://127.0.0.1:8088\n' >> "$TARGET_DIR/.env"
                    cp "$TARGET_DIR/.env" "$TARGET_DIR/server/.env"
                    pm2 restart nyx-api --update-env
                    echo "✅ KT_V2_SERVER_URL ditambahkan — penulisan log KT v2 aktif setelah API restart"
                fi
            fi
            if systemctl is-enabled --quiet nyx-kt-query-v2 2>/dev/null; then
                if [ ! -x "$KT_V2_BIN" ]; then
                    echo "::error::binary nyx-kt-query-v2 tidak ada di $KT_V2_BIN — layanan log KT v2 tidak bisa dijalankan"
                    exit 1
                fi
                systemctl restart nyx-kt-query-v2
                sleep 2
                if systemctl is-active --quiet nyx-kt-query-v2; then
                    echo "✅ nyx-kt-query-v2 aktif — log KT v2 hidup"
                    curl -fsS --max-time 5 http://127.0.0.1:8089/healthz; echo
                else
                    systemctl status nyx-kt-query-v2 --no-pager -l || true
                    echo "::error::nyx-kt-query-v2 gagal start setelah deploy — log KT v2 berhenti"
                    exit 1
                fi
            else
                echo "ℹ️  nyx-kt-query-v2.service belum di-enable — pemasangan pertama ada di ops/systemd/README.md"
            fi

            # 11. AUDITOR KT v2 (`nyx-kt-auditor-v2`) — ML-DSA, terpisah dari log
            #     dan dari auditor v1. Restart setelah log v2 hidup.
            echo "🧾 Deploying Key Transparency auditor v2 (nyx-kt-auditor-v2)..."
            AUDITOR_V2_BIN="$KT_DIR/nyx-kt-auditor-v2"
            if [ -f "$TARGET_DIR/ops/systemd/nyx-kt-auditor-v2.service" ]; then
                install -m 644 "$TARGET_DIR/ops/systemd/nyx-kt-auditor-v2.service" /etc/systemd/system/nyx-kt-auditor-v2.service
                systemctl daemon-reload
            fi
            if systemctl is-enabled --quiet nyx-kt-auditor-v2 2>/dev/null; then
                if [ ! -x "$AUDITOR_V2_BIN" ]; then
                    echo "::error::binary nyx-kt-auditor-v2 tidak ada di $AUDITOR_V2_BIN — auditor v2 tidak bisa dijalankan"
                    exit 1
                fi
                systemctl restart nyx-kt-auditor-v2
                sleep 2
                if systemctl is-active --quiet nyx-kt-auditor-v2; then
                    echo "✅ nyx-kt-auditor-v2 aktif — tree head v2 diaudit"
                else
                    systemctl status nyx-kt-auditor-v2 --no-pager -l || true
                    echo "::error::nyx-kt-auditor-v2 gagal start setelah deploy — log v2 berhenti ditandatangani auditor"
                    exit 1
                fi
            else
                echo "ℹ️  nyx-kt-auditor-v2.service belum di-enable — auditor v2 belum dipasang (ops/systemd/README.md)"
            fi

            # 12. RELAY OHTTP PROSES TERPISAH (docs/37 §37.4 P7, docs/10 §10.18)
            #     Dipasang seperti unit lain, tetapi hanya disentuh bila operator
            #     sudah `enable` (pemasangan pertama manual: env + systemd).
            echo "🛰️  Deploying OHTTP relay (nyx-ohttp-relay)..."
            if [ -f "$TARGET_DIR/ops/systemd/nyx-ohttp-relay.service" ]; then
                install -m 644 "$TARGET_DIR/ops/systemd/nyx-ohttp-relay.service" /etc/systemd/system/nyx-ohttp-relay.service
                systemctl daemon-reload
            fi
            if systemctl is-enabled --quiet nyx-ohttp-relay 2>/dev/null; then
                if [ ! -f "$TARGET_DIR/server/dist/ohttp/relay.js" ]; then
                    echo "::error::dist/ohttp/relay.js tidak ada — relay OHTTP tidak bisa dijalankan"
                    exit 1
                fi
                systemctl restart nyx-ohttp-relay
                sleep 2
                if systemctl is-active --quiet nyx-ohttp-relay; then
                    echo "✅ nyx-ohttp-relay aktif"
                    curl -fsS --max-time 5 http://127.0.0.1:4100/healthz; echo
                else
                    systemctl status nyx-ohttp-relay --no-pager -l || true
                    echo "::error::nyx-ohttp-relay gagal start setelah deploy"
                    exit 1
                fi
            else
                echo "ℹ️  nyx-ohttp-relay.service belum di-enable — relay masih dilayani API (OHTTP_RELAY_EXTERNAL tidak diset)"
            fi

            # 13. VERIFIKASI SALINAN SELFHOST (non-blocking): config nginx dan unit
            #     systemd di repo adalah sumber; ~/nyx-selfhost hanya salinan.
            #     Drift dicatat sebagai peringatan supaya deploy tidak gagal karena
            #     mesin selfhost yang memang dikelola operator.
            if [ -d /root/nyx-selfhost ] && [ -f "$TARGET_DIR/scripts/sync-selfhost.sh" ]; then
                echo "🔍 Checking selfhost copy drift..."
                SELFHOST_DIR=/root/nyx-selfhost bash "$TARGET_DIR/scripts/sync-selfhost.sh" --check \
                    || echo "::warning::Salinan ops di /root/nyx-selfhost berbeda dari repo — jalankan scripts/sync-selfhost.sh --apply"
            fi

            echo "✅ Deployment Success!"

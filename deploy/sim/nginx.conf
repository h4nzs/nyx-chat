# Stack simulasi NYX: satu origin untuk aplikasi + API, seperti deployment
# selfhost (nginx meneruskan /api ke server dan /api/ohttp/relay ke relay
# proses terpisah). COOP/COEP dipasang karena dev server selalu memasangnya
# (SQLite OPFS) — tanpa itu perilaku build produksi menyimpang dari E2E dev.
# WebSocket/HMR Vite dev server: `Connection` harus "upgrade" hanya bila ada
# header Upgrade, kalau tidak request biasa akan dipaksa upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # `docker compose up -d` yang hanya membuat ulang `server`/`web` memberi
    # mereka IP baru; nginx me-resolve nama upstream SEKALI saat start, jadi
    # edge yang tidak ikut dibuat ulang terus menembak IP lama (gejala: /health
    # menggantung lalu 502, seluruh harness terlihat "API tidak siap"). Resolver
    # DNS bawaan Docker + proxy_pass variabel membuat nginx me-resolve ulang.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nyx_api server:4000;
    set $nyx_web web:5173;
    set $nyx_ohttp_relay ohttp-relay:4100;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;

    # Relay OHTTP terpisah: path publik /api/ohttp/relay → /relay di relay.
    location = /api/ohttp/relay {
        rewrite ^/api/ohttp/relay$ /relay break;
        proxy_pass http://$nyx_ohttp_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://$nyx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://$nyx_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://$nyx_api;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://$nyx_api/health;
        proxy_set_header Host $host;
    }

    # Aplikasi dilayani Vite dev server di container `web`, bukan bundle
    # produksi: suite E2E mengimpor modul sumber (`/src/...`) di dalam
    # `page.evaluate`, yang tidak ada setelah `vite build`. Minifikasi bundle
    # tetap diuji job `build` di CI; nilai stack ada pada integrasi layanan
    # nyata (coturn, WebTransport, OHTTP, PIR, KT).
    #
    # Lokasi ini sengaja TIDAK memakai `add_header`: `add_header` di dalam
    # location mematikan pewarisan header dari level server, dan tanpa
    # CORP/COEP Chrome memblokir worker (`ERR_BLOCKED_BY_RESPONSE`).
    location / {
        proxy_pass http://$nyx_web;
        proxy_http_version 1.1;
        # Vite dev juga memasang COOP/COEP/CORP. Header ganda membuat Chrome
        # mengabaikan kebijakan isolasi (crossOriginIsolated=false) sehingga
        # VFS `opfs` SQLite gagal dibuka (rc 12). Buang versi upstream; nginx
        # adalah satu-satunya sumber header di atas.
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# Override HANYA untuk harness E2E di host.
#
# `server/scripts/reset-test-env.ts` sengaja menolak host non-loopback supaya
# DB produksi tidak bisa terhapus. Karena Postgres/Redis berada di jaringan
# internal compose, harness mempublikasikannya di 127.0.0.1 (port tidak lazim
# agar tidak bentrok dengan instance dev) dan global setup Playwright berjalan
# di host dengan URL loopback. `scripts/sim/e2e.sh` yang memakai file ini;
# `scripts/sim/up.sh` tidak.
#
# Docker TIDAK mempublikasikan port container yang hanya terhubung ke network
# `internal: true` (config tetap benar, `NetworkSettings.Ports` berisi null).
# Karena itu postgres/redis juga dipasang ke `e2e-publish`, bridge biasa yang
# hanya dipakai untuk binding host ini.
#
# Metrics API ikut dipublikasikan (127.0.0.1:19464) karena spec OHTTP membaca
# counter tag klien relay dari exporter. Port itu sama dengan milik stack
# `playwright.ohttp.config.ts`; jangan jalankan keduanya bersamaan.
services:
  # E2E mendaftarkan user lalu langsung mencarinya. Rebuild dirty default 3
  # menit terlalu lambat, jadi stack uji memakai tick 5 detik; user baru masuk
  # snapshot sebelum helper pencarian berikutnya berjalan.
  server:
    environment:
      PIR_DIRTY_REFRESH_CRON: "*/5 * * * * *"
      # `e2e/ohttp.spec.ts` membaca `nyx_ohttp_client_tag_total` dari exporter
      # API, dan exporter produksi sengaja loopback-only. Stack uji membukanya
      # di antarmuka container (jaringan compose, bukan internet) lalu
      # mempublikasikannya hanya ke 127.0.0.1 host — jangan tiru di produksi.
      METRICS_HOST: "0.0.0.0"
      # Gate Privacy Pass dinyalakan di harness supaya `privacyPassSync.spec.ts`
      # benar-benar menguji penolakan sync tanpa bukti (403 PP_PROOF_REQUIRED).
      # Ini konfigurasi PRODUK yang lebih ketat dari default build ini
      # (docs/43 §43.14): `up.sh` biasa tetap membiarkannya kosong.
      PP_SYNC_REQUIRED: "1"
    ports:
      - "127.0.0.1:19464:9464"
    networks:
      data: {}
      e2e-publish: {}

  postgres:
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      data: {}
      e2e-publish: {}
  redis:
    ports:
      - "127.0.0.1:56379:6379"
    networks:
      data: {}
      e2e-publish: {}

networks:
  e2e-publish:
    driver: bridge

#
# [docs/27 §27.7 + docs/30 WS-G] Alert untuk VPS NYX.
#
# Semua aturan di bawah HANYA memakai metrik event/host — tidak ada label yang
# memuat userId/usernameHash/IP (lihat server/src/utils/metrics.ts; penjaganya
# menolak nilai berbentuk identitas). Snapshot hierarki:
#
#   ops/prometheus/prometheus.yml   — konfigurasi scrape (loopback /metrics)
#   ops/prometheus/alerts.yml       — file ini
#
# Notifikasi: sambungkan via Alertmanager (`alertmanager.yml` di VPS, tidak di
# commit karena berisi token). Target respons: lihat docs/10 §10.12.

groups:
  - name: nyx-app
    rules:
      # Eksporter metrik mati = kita kehilangan seluruh visibilitas. Ini alarm
      # "buta", bukan alarm performa — makanya severity-nya tinggi.
      - alert: NyxMetricsExporterDown
        expr: up{job="nyx-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Exporter metrik nyx-api tidak bisa di-scrape"
          description: "Prometheus gagal scrape selama 5 menit. Cek proses pm2 nyx-api dan port loopback METRICS_PORT."

      # Penjaga privasi: nilai berbentuk identitas pernah dicoba masuk ke metrik.
      # Harus SELALU 0 di produksi.
      - alert: NyxMetricsIdentityLeakAttempt
        expr: sum by (reason) (increase(nyx_metrics_rejected_total[15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ada percobaan mencatat metrik dengan label identitas"
          description: "nyx_metrics_rejected_total naik (reason={{ $labels.reason }}). Ada kode baru yang mencoba mengirim userId/usernameHash/IP/token ke metrik. Perbaiki pemanggilnya (server/src/utils/metrics.ts akan selalu menolak nilainya)."

      # Sweeper harian tidak jalan / gagal → data kedaluwarsa menumpuk
      # (token, session key, story, dead-man switch tidak tereksekusi).
      #
      # [drill 2026-10-14] Suku kedua dari `or` WAJIB: gauge ini hanya lahir
      # setelah satu putaran sweeper selesai (`sweepOnce` finally). Saat proses
      # baru (belum pernah menyapu) seri-nya TIDAK ADA, dan `time() - max(...)`
      # atas vektor kosong = kosong → alert diam. Skenario yang justru paling
      # penting (cron mati sejak boot / pm2 restart sebelum 00:00) tidak pernah
      # terdeteksi. `absent_over_time` menutupnya dan TIDAK false-positive saat
      # restart normal: sampel lama masih ada di dalam jendela 26 jam.
      - alert: NyxSweeperStale
        expr: |
          time() - max(nyx_sweeper_last_run_timestamp_seconds) > 26 * 3600
          or absent_over_time(nyx_sweeper_last_run_timestamp_seconds[26h])
        for: 30m
        labels:
          severity: high
        annotations:
          summary: "Sweeper sistem belum jalan >26 jam"
          description: "Cek pm2 nyx-api (cron in-process) dan log '[Cron]'."

      - alert: NyxSweeperFailed
        expr: sum by (result) (increase(nyx_sweeper_duration_seconds_count{result="error"}[26h])) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Putaran sweeper sistem gagal"
          description: "Lihat log '[Cron] Gagal melakukan pembersihan database' — biasanya Postgres tak bisa dihubungi atau lock."

      - alert: NyxSweeperSlow
        expr: histogram_quantile(0.95, sum(rate(nyx_sweeper_duration_seconds_bucket[7d])) by (le)) > 120
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sweeper makin lambat (p95 > 120s)"
          description: "Biasanya indeks hilang atau tabel membengkak. Cek EXPLAIN pada query sweeper."

      # Blokir keamanan sesi melonjak = indikasi kloning sesi / device di-kick
      # massal / klien stuck di device lama.
      - alert: NyxSecurityBlocksSpike
        expr: sum by (op, reason) (increase(nyx_security_blocks_total[30m])) > 25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Blokir keamanan sesi/perangkat melonjak ({{ $labels.reason }})"
          description: "Periksa apakah ini pola kloning sesi, atau klien yang perlu re-auth setelah deploy."

      # [docs/30 §30.12 WS-H] Gerbang attestation perangkat saat pendaftaran.
      #
      # Dua kegagalan di bawah ini sama-sama TIDAK berisik: tidak ada error 5xx,
      # tidak ada lonjakan latensi, dan semua endpoint lain tetap 200. Yang
      # terjadi hanya `403 ATTESTATION_REJECTED: <KODE>` pada `/register` — satu
      # baris log per percobaan, mudah tenggelam di antara log akses.
      #
      # (1) `root_not_trusted`: bundle root operator tidak memuat root vendor
      #     perangkat yang dipakai pendaftar. Akibatnya akun baru TIDAK BISA
      #     dibuat dari perangkat itu — bukan cuma sybil yang tertahan — dan
      #     satu-satunya perbaikan adalah menambah root yang benar (skrip
      #     `scripts/attestation-roots.mjs refresh`; bundle dibaca ulang dari
      #     mtime, tanpa restart). Karena itu `for: 0m`: setiap penolakan jenis
      #     ini adalah orang nyata yang gagal mendaftar, bukan noise statistik.
      #     Perhatikan juga: sybil yang memakai sertifikat self-signed TIDAK
      #     memicu aturan ini bila tidak ada satu pun root yang dipin — rantai
      #     `x5c` self-signed berujung diterima oleh aturan puncak default.
      # (2) Rasio, bukan jumlah mentah: 20 penolakan dari 20.000 pendaftaran
      #     adalah noise, sedangkan 3 dari 4 adalah kebijakan yang tidak cocok
      #     dengan perangkat di lapangan. Penyebutnya hanya `accepted|rejected`
      #     supaya `missing`/`challenge_invalid` (klien salah, bukan kebijakan)
      #     tidak mengencerkan angka. Ambang `>= 3` mencegah satu percobaan yang
      #     salah (pengguna membatalkan prompt biometrik) memicu alarm.
      #     Penyebut dijaga `or vector(0)` + `clamp_min`: tanpa itu, jendela yang
      #     belum punya sampel memberi vektor kosong dan pembagian nol memberi
      #     NaN — perbandingannya selalu false tanpa error apa pun, justru saat
      #     semua pendaftaran ditolak.
      - alert: NyxAttestationRootNotTrusted
        expr: sum by (result, reason) (increase(nyx_attestation_registration_total{result="rejected",reason="root_not_trusted"}[1h])) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Pendaftaran ditolak: root attestation perangkat tidak dipercaya"
          description: "Ada rantai attestation yang berakhir di root di luar bundle operator (reason=root_not_trusted). Perangkat itu tidak bisa membuat akun baru. Salin kode penolakan dari body `403 ATTESTATION_REJECTED: <KODE>`, lalu segarkan bundle: `node scripts/attestation-roots.mjs refresh --out <ABUSE_ATTESTATION_ROOTS_FILE>` (tanpa restart) atau pin fingerprint vendor lewat ABUSE_ATTESTATION_ROOTS. Jangan longgarkan ABUSE_ATTESTATION_ALLOW_UNVERIFIED_CHAIN untuk menutupinya."

      - alert: NyxAttestationRejectionRateHigh
        expr: |
          (
            sum(rate(nyx_attestation_registration_total{result="rejected"}[30m]))
              /
            clamp_min(
              (sum(rate(nyx_attestation_registration_total{result=~"accepted|rejected"}[30m])) or vector(0)),
              0.001
            )
          ) > 0.5
          and
          sum(increase(nyx_attestation_registration_total{result="rejected"}[1h])) >= 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lebih dari separuh pendaftaran ditolak gerbang attestation"
          description: "Rasio penolakan terhadap (accepted+rejected) melewati 50% selama 30 menit dengan minimal 3 penolakan/jam. Kode di body `403 ATTESTATION_REJECTED: <KODE>` menentukan penyebabnya: `format_not_allowed`/`synced_authenticator`/`user_verification` = kebijakan lebih ketat dari perangkat pengguna; `root_not_trusted`/`certificate_expired` = bundle root ketinggalan. Rincian per alasan ada di seri metrik ini dengan label result=rejected."

      # [docs/30 §30.12 WS-H] Bundle root attestation bisa "basi" tanpa satu
      # pun error: root yang sudah kedaluwarsa tetap ada di berkas dan hanya
      # gagal saat dipakai (penolakan `certificate_expired` di atas), sedangkan
      # MDS memberi tanggal `nextUpdate` yang tidak pernah diperiksa siapa pun.
      # Gauge diisi saat boot dari metadata yang ditulis skrip refresh; tanpa
      # metadata, seri ini tidak ada dan aturan diam (bukan false positive).
      - alert: NyxAttestationRootExpired
        expr: max(nyx_attestation_roots_expired_certs) > 0
        for: 1h
        labels:
          severity: high
        annotations:
          summary: "Bundle root attestation memuat sertifikat kedaluwarsa"
          description: "nyx_attestation_roots_expired_certs > 0: ada anchor yang sudah lewat validTo dan tidak akan pernah bisa memverifikasi rantai baru. Segarkan bundle dengan `node scripts/attestation-roots.mjs refresh --out <ABUSE_ATTESTATION_ROOTS_FILE>` lalu restart nyx-api agar gauge dan peringatan boot ikut diperbarui."

      - alert: NyxAttestationRootBundleStale
        expr: max(nyx_attestation_roots_next_update_timestamp_seconds) < time()
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Bundle root attestation melewati nextUpdate MDS"
          description: "Metadata bundle menunjukkan tanggal nextUpdate FIDO MDS sudah lewat, jadi daftar root yang dianggap sah mungkin tidak lagi lengkap. Jalankan `node scripts/attestation-roots.mjs refresh --out <ABUSE_ATTESTATION_ROOTS_FILE>` (verifikasi JWS MDS ikut dijalankan) sebelum perangkat baru mulai ditolak dengan reason=root_not_trusted."

  # ==========================================================================
  # Auditor pihak ketiga log Key Transparency (mode 3, `nyx-kt-auditor-v2`).
  #
  # Kelas kegagalan di grup ini HARUS bisa dibedakan, karena tindakannya
  # berbeda: proses mati (`NyxKtAuditorDown`), proses hidup tapi tidak maju
  # (`…RoundStalled`), layanan log tidak bisa dihubungi (`…RoundFailing`),
  # layanan log menyajikan riwayat TIDAK KONSISTEN (`…ProofInconsistent` —
  # peristiwa keamanan), tree head ditolak/tidak sampai (`…HeadRejected`), dan
  # proses yang start ulang terus sehingga jam tanda tangan tidak pernah selesai
  # (`…HeadStale`/`…Restarting`).
  #
  # Kenapa ini penting: tanpa auditor yang menandatangani, log KT berjalan
  # `ContactMonitoring`. Tidak ada error di aplikasi, tidak ada penolakan di
  # klien — sampai auditor head terakhir melewati batas 7 hari dan klien mulai
  # MENOLAK bukti (docs/34 §34.5). Alarm di grup ini adalah satu-satunya hal
  # yang berdiri di antara "auditor mati" dan "verifikasi klien gagal".
  # ==========================================================================
  - name: nyx-kt-auditor-v2
    rules:
      - alert: NyxKtAuditorDown
        expr: up{job="nyx-kt-auditor-v2"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Auditor log KT tidak bisa di-scrape (proses mati?)"
          description: "Prometheus gagal scrape auditor selama 10 menit. Cek unit nyx-kt-auditor-v2 (systemd) + journalctl -u nyx-kt-auditor-v2; cek juga NYX_KT_V2_AUDITOR_METRICS_ADDR."

      # Proses hidup tapi tidak ada putaran audit yang SELESAI. `up == 1` tidak
      # menangkap kasus ini: auditor bisa menggantung di gRPC/Audit tanpa timeout,
      # atau loop-nya mati tanpa mematikan proses.
      #
      # [penting] Kedua sisi `and` dibuat TANPA label: `max(up{...})` (kiri) dan
      # `absent(...)` (kanan). `up{job=...}` bersanding dengan `absent()` yang
      # tak berlabel menghasilkan irisan kosong — kelas kesalahan yang sama
      # dengan catatan di NyxKeyTransparencyStalled, dan akibatnya aturan itu
      # diam selamanya.
      - alert: NyxKtAuditorRoundStalled
        expr: |
          max(up{job="nyx-kt-auditor-v2"}) == 1
          and (
            time() - max(nyx_kt_auditor_last_round_timestamp_seconds) > 600
            or absent(nyx_kt_auditor_last_round_timestamp_seconds)
          )
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Auditor log KT hidup tetapi tidak ada putaran audit selesai >10 menit"
          description: "Prosesnya masih bisa di-scrape, jadi ini bukan kematian proses. Lihat journalctl -u nyx-kt-auditor-v2 (blokir gRPC tanpa timeout?) dan pastikan NYX_KT_V2_QUERY_URL + NYX_KT_V2_AUDITOR_ADDR menunjuk log yang benar."

      # Putaran gagal (layanan baca/audit tidak menjawab, koneksi putus). Beda
      # dari Stalled: putarannya BERJALAN, hanya tidak pernah selesai bersih.
      - alert: NyxKtAuditorRoundFailing
        expr: increase(nyx_kt_auditor_rounds_total{result="error"}[30m]) > 0
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Putaran audit log KT gagal (tidak bisa diverifikasi)"
          description: "Auditor tidak bisa menyelesaikan putaran: cek nyx-kt-query-v2 hidup, NYX_KT_V2_QUERY_URL, dan NYX_KT_V2_AUDITOR_ADDR. Selama ini berlangsung, tidak ada bukti baru yang diperiksa."

      # Peristiwa keamanan, bukan gangguan operasional: auditor melihat riwayat
      # yang tidak konsisten dengan pohon yang sudah ia verifikasi sendiri.
      - alert: NyxKtAuditorProofInconsistent
        expr: increase(nyx_kt_auditor_rounds_total{result="inconsistent"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Auditor menemukan riwayat log KT TIDAK KONSISTEN (tanda tangan dihentikan)"
          description: "Bukti dari layanan log tidak cocok dengan pandangan auditor (errInvalidProof). Auditor berhenti menandatangani — perilaku yang benar. Perlakukan sebagai insiden: periksa journalctl -u nyx-kt-auditor-v2 (\"TIDAK KONSISTEN\"), state auditor, dan apakah log dipulihkan dari snapshot/backup yang berbeda."

      # Tree head ditolak layanan log (mode bukan 3, kunci auditor tidak terdaftar,
      # atau layanan log mati). Head yang tidak sampai berarti jaminan auditas
      # tidak bertambah, meski auditor sendiri sehat.
      - alert: NyxKtAuditorHeadRejected
        expr: increase(nyx_kt_auditor_head_sends_total{result="error"}[30m]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Tree head auditor ditolak/tidak sampai ke layanan log"
          description: "SetAuditorHead gagal: pastikan log berjalan mode 3 (api.auditors terisi, /config → mode=3), nama auditor di NYX_KT_V2_AUDITOR_NAME sama dengan yang di config, dan kunci publiknya cocok (nyx-kt-auditor-v2 -print-public-key)."

      # Cadangan terakhir, dan satu-satunya alarm yang mengukur hal yang benar-
      # benar dipakai klien: umur tree head terakhir yang DITERIMA log.
      #
      # `nyx_kt_auditor_tree_size > 0` menjaga deployment sepi (belum ada entri
      # untuk ditandatangani) tidak salah alarm — tanpa entri, tidak ada yang
      # bisa ditandatangani. Ambang 6 jam = 6× irama default (1 jam), tetap jauh
      # di bawah batas 7 hari klien.
      #
      # [drill 2026-10-16] Cabang `absent()` TANPA penjaga umur proses adalah
      # alarm palsu yang pasti: `nyx_kt_auditor_last_head_timestamp_seconds`
      # hanya lahir setelah kiriman head pertama diterima, sedangkan head pertama
      # sengaja menunggu irama tanda tangan (1 jam). Setiap RESTART auditor karena
      # itu akan "menyala" 30 menit kemudian (durasi `for`) padahal prosesnya
      # sehat — dan alarm yang menyala setiap deploy/restart akan diabaikan
      # operator, yang membuat aturan ini mati secara praktis.
      #
      # `nyx_kt_auditor_uptime_seconds` menutupnya: cabang "belum pernah ada head"
      # hanya berlaku setelah proses berjalan >2 jam (2× irama default). Sisi lain
      # dari koin — proses yang start ulang terus sehingga umurnya selalu muda —
      # ditangkap `NyxKtAuditorRestarting` di bawah.
      - alert: NyxKtAuditorHeadStale
        expr: |
          max(up{job="nyx-kt-auditor-v2"}) == 1
          and nyx_kt_auditor_tree_size > 0
          and (
            time() - max(nyx_kt_auditor_last_head_timestamp_seconds) > 6 * 3600
            or (
              absent(nyx_kt_auditor_last_head_timestamp_seconds)
              and min(nyx_kt_auditor_uptime_seconds) > 2 * 3600
            )
          )
        for: 30m
        labels:
          severity: high
        annotations:
          summary: "Tree head auditor belum diperbarui >6 jam"
          description: "Ada entri yang bisa ditandatangani (tree_size > 0) tetapi tidak ada tree head yang diterima log selama 6 jam. Cek journalctl -u nyx-kt-auditor-v2 (cari \"tree head DIKIRIM\") dan NYX_KT_V2_AUDITOR_SIGNATURE_INTERVAL. Klien menolak auditor head yang lebih tua dari 7 hari (docs/34 §34.5)."

      # Pasangan wajib dari penjaga umur di atas: proses yang start ulang terus
      # menerus selalu punya umur muda, jadi `…HeadStale` buta terhadapnya —
      # padahal setiap start ulang mengulang jam tanda tangan dari nol dan head di
      # log bisa tidak pernah diperbarui (satu restart per jam sudah cukup untuk
      # mencegah tanda tangan sama sekali).
      #
      # DUA sinyal, karena dua bentuk restart tidak terlihat oleh sinyal yang
      # sama (keduanya diuji di tests.yml):
      #
      #  1. `changes(up[1h]) > 2` — restart yang cukup lambat sehingga setidaknya
      #     satu scrape melihat `up == 0` (dua transisi 1→0→1 per restart).
      #  2. `resets(nyx_kt_auditor_uptime_seconds[1h]) > 1` — restart yang CEPAT
      #     (kurang dari satu irama scrape): `up` tidak pernah terlihat 0, tetapi
      #     umur proses turun antar-scrape. `resets()` TIDAK menghitung lompatan
      #     yang dipisahkan penanda stale, dan justru itu alasan cabang 1 ada.
      #
      # Ambang >1 (bukan >0) untuk cabang 2: satu restart per jam adalah bagian
      # dari operasi normal (deploy), bukan loop.
      - alert: NyxKtAuditorRestarting
        expr: |
          changes(up{job="nyx-kt-auditor-v2"}[1h]) > 2
          or resets(nyx_kt_auditor_uptime_seconds[1h]) > 1
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Auditor log KT berulang kali restart dalam 1 jam terakhir"
          description: "Proses auditor start ulang ≥2 kali dalam 1 jam (lihat journalctl -u nyx-kt-auditor-v2 -n 200). Auditor yang start ulang terus tidak pernah sampai irama tanda tangan (NYX_KT_V2_AUDITOR_SIGNATURE_INTERVAL), jadi tidak ada tree head baru yang diterima log meski `up` terlihat sehat pada saat scrape — dan alert `…HeadStale` buta terhadapnya karena umur prosesnya selalu muda."

      # Penjaga privasi sisi auditor — cermin NyxMetricsIdentityLeakAttempt.
      - alert: NyxKtAuditorMetricsIdentityLeakAttempt
        expr: increase(nyx_kt_auditor_metrics_rejected_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ada percobaan mencatat metrik auditor dengan label identitas"
          description: "nyx_kt_auditor_metrics_rejected_total naik (reason={{ $labels.reason }}). Ada kode baru di cmd/nyx-kt-auditor-v2 yang mencoba mengirim nama/ID/IP ke metrik; pemanggilnya harus diperbaiki (metrics.go akan selalu menolak nilainya)."

  # ==========================================================================
  # Transport WebTransport (`nyx-sidecar`, Rust).
  #
  # Kenapa grup ini ada padahal aplikasi tetap "jalan" tanpanya: klien yang tidak
  # bisa handshake WebTransport **tidak error** — ia turun ke WSS secara senyap
  # (`web/src/lib/transportMode.ts`). Tidak ada satu pun baris log di nyx-api,
  # tidak ada penolakan di klien, tidak ada error 5xx. Yang hilang hanya jalur
  # cepat: latensi lebih buruk, dan (untuk ponsel di jaringan buruk) panggilan
  # yang lebih mudah tersendat. Tanpa job scrape ini, sidecar boleh mati berhari-
  # hari tanpa ada yang tahu — karena itu `up{job="nyx-sidecar"}` adalah alarm
  # "buta", bukan alarm performa.
  # ==========================================================================
  - name: nyx-transport
    rules:
      - alert: NyxTransportSidecarDown
        expr: up{job="nyx-sidecar"} == 0
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Sidecar WebTransport tidak bisa di-scrape (proses mati?)"
          description: "Prometheus gagal scrape sidecar selama 10 menit. Aplikasi TIDAK ikut mati: klien otomatis jatuh ke WSS, jadi gejalanya hanya latensi. Cek `systemctl --user status nyx-sidecar` / pm2 nyx-sidecar, journalctl, dan TRANSPORT_METRICS_ADDR (default 127.0.0.1:9465)."

      # Pola restart yang sama dengan auditor (lihat NyxKtAuditorRestarting):
      # dua sinyal, karena restart cepat (< satu interval scrape) tidak pernah
      # terlihat sebagai `up == 0`. Sidecar yang restart terus = sesi
      # WebTransport diputus berulang, dan setiap putus memaksa klien handshake
      # ulang / mundur ke WSS.
      - alert: NyxTransportSidecarRestarting
        expr: |
          changes(up{job="nyx-sidecar"}[1h]) > 2
          or resets(nyx_transport_uptime_seconds[1h]) > 1
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Sidecar WebTransport berulang kali restart dalam 1 jam terakhir"
          description: "Proses sidecar start ulang ≥2 kali dalam 1 jam. Setiap start ulang memutus semua sesi WebTransport aktif (klien mundur ke WSS sampai handshake berikutnya). Lihat journalctl -u nyx-sidecar dan cek TLS/cert hash atau batas memori (OOM killer)."

      # Semua label child (`ticket`/`bwh`, dan tiap alasan) lahir bernilai 0 di
      # awal proses (metrics.rs merender enum `ALL`), jadi `increase()` di sini
      # TIDAK rapuh terhadap restart — beda dengan prom-client di sisi TS.
      - alert: NyxTransportAuthFailuresSpike
        expr: increase(nyx_transport_auth_failures_total[15m]) > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Autentikasi WebTransport gagal berulang ({{ $labels.reason }})"
          description: "Lebih dari 50 kegagalan auth dalam 15 menit. `ticket_invalid`/`bwh_invalid` biasanya berarti JWT_SECRET sidecar tidak sama dengan server (atau ticket kedaluwarsa karena jam mesin meleset), bukan serangan."

      # Frame yang dibuang SEBELUM diteruskan. `chaff` (opcode 0x00 dari klien
      # yang sehat) sengaja TIDAK dihitung: itu traffic-cover yang normal. Yang
      # tersisa — `malformed`/`too_large`/`hello_wrong_path` — berarti klien
      # rusak (versi lama/beda build) atau probe. Ini alarm integritas protokol,
      # bukan alarm beban.
      - alert: NyxTransportMalformedFramesSpike
        expr: increase(nyx_transport_rejected_frames_total{reason!="chaff"}[15m]) > 25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Frame WebTransport dibuang karena tidak sah ({{ $labels.reason }})"
          description: "Ada klien/probe yang mengirim frame tidak sesuai protokol (opcode & path harus sinkron dengan packages/shared/src/transport.ts). Kalau ini muncul tepat setelah deploy, curigai perubahan protokol yang tidak sinkron antara web dan sidecar."

      # ----------------------------------------------------------------------
      # Latensi jalur: WebTransport vs WSS (ditambahkan 2026-10-17).
      #
      # Kenapa latensi, bukan hanya "sidecar hidup": jalur cepat yang MELAMBAT
      # tidak menghasilkan satu pun error. Klien tidak tahu bahwa jalur yang
      # seharusnya lebih cepat kini lebih lambat, sidecar tetap `up`, dan
      # `…Down` diam — sampai suatu hari handshake-nya gagal dan semua klien
      # mundur ke WSS. Dua aturan di bawah menutup jendela itu, dengan DUA angka
      # yang berasal dari dua proses berbeda:
      #
      #   `nyx_transport_ingress_seconds` (sidecar, :9465) = dari frame klien
      #     utuh diterima sampai diteruskan ke Redis (`nyx:upstream`).
      #   `nyx_wss_ingress_seconds` (nyx-api, :9464) = dari event socket.io
      #     diterima sampai handler selesai (validasi + rate limit + perangkat +
      #     publish ke `nyx:downstream`).
      #
      # Kedua cakupan TIDAK identik dan itu disengaja: pada jalur WT, pekerjaan
      # yang di WSS ada di dalam span itu (rate limit, pemeriksaan perangkat)
      # justru terjadi di proses Node SETELAH hop yang diukur sidecar. Artinya
      # span WSS memuat pekerjaan yang lebih banyak — jadi pembanding "WT lebih
      # lambat daripada WSS" hanya menyala ketika jalur cepat benar-benar sudah
      # kehilangan keunggulannya, bukan pada selisih kecil yang wajar. Semua
      # ambangnya di bawah berlaku pada p95 (bukan rata-rata): satu frame yang
      # tertahan lama adalah yang dirasakan pengguna.
      #
      # Bucket histogram-nya HARUS sama di kedua sisi
      # (`INGRESS_BUCKETS` di metrics.rs ↔ `WSS_INGRESS_SECONDS` di metrics.ts).
      # p95 dari dua histogram dengan pembagian bucket berbeda tidak sebanding,
      # dan itu tidak memunculkan error apa pun — hanya perbandingan yang bohong.
      # ----------------------------------------------------------------------

      # Jaring terakhir, TANPA pembanding: 250 ms untuk hop yang normalnya
      # sub-milidetik berarti prosesnya tersendat (event loop kelaparan, Redis
      # lambat/putus, atau chaff membanjiri jalur baca). Penjaga
      # `rate(..._count[15m]) > 0` wajib: tanpa trafik, histogram kosong dan
      # `histogram_quantile` mengembalikan vektor kosong — tetapi penjaga ini
      # membuat maksudnya eksplisit dan mencegah alarm yang lahir dari
      # ketiadaan data ("diam" ≠ "sehat", tapi juga bukan "lambat").
      - alert: NyxTransportIngressSlow
        expr: |
          sum(rate(nyx_transport_ingress_seconds_count[15m])) > 0
          and
          histogram_quantile(0.95, sum by (le) (rate(nyx_transport_ingress_seconds_bucket[15m]))) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ingress WebTransport lambat (p95 > 250 ms)"
          description: "p95 hop sidecar (frame diterima → diteruskan ke Redis) melewati 250 ms padahal normalnya sub-milidetik. Jalur cepatnya masih HIDUP (alerts `…Down` diam), jadi ini satu-satunya peringatan sebelum klien mulai mundur ke WSS. Cek: beban event loop sidecar (chaff/traffic-cover yang membanjir), latensi Redis lokal, dan CPU host (1 core: satu proses yang menyerobot CPU cukup untuk ini)."

      # Pembanding antar jalur — inilah "penurunan jalur cepat" dalam bentuk
      # paling faktual: jalur WebTransport sudah TIDAK lebih cepat daripada
      # jalur cadangannya, padahal span WSS memuat lebih banyak pekerjaan.
      # Kedua penjaga laju wajib: tanpa trafik di salah satu jalur, tidak ada
      # yang bisa dibandingkan (dan perbandingan dengan jalur yang tidak dipakai
      # adalah alarm yang tidak berarti apa-apa).
      - alert: NyxTransportSlowerThanWss
        expr: |
          (
            histogram_quantile(0.95, sum by (le) (rate(nyx_transport_ingress_seconds_bucket[15m])))
            > histogram_quantile(0.95, sum by (le) (rate(nyx_wss_ingress_seconds_bucket[15m])))
          )
          and sum(rate(nyx_transport_ingress_seconds_count[15m])) > 0
          and sum(rate(nyx_wss_ingress_seconds_count[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Jalur WebTransport lebih lambat daripada fallback WSS (p95)"
          description: "p95 ingress WebTransport melewati p95 ingress WSS selama 30 menit, padahal span WSS memuat pekerjaan lebih banyak (rate limit + pemeriksaan perangkat + publish). Artinya keunggulan jalur cepat sudah hilang, dan klien yang jatuh ke WSS tidak akan merasakan kerugian apa pun — sehingga tidak ada yang mengeluh sampai sidecar benar-benar mati. Cek CPU host, latensi Redis lokal, dan jumlah sesi WT aktif."

      # Penurunan KETIGA — dan yang paling sepi: jalur cepatnya tidak melambat
      # dan tidak mati, ia cuma berhenti DIPAKAI. Sesi WT habis, klien sudah
      # pindah ke WSS (fallback berjalan persis seperti yang dirancang: senyap),
      # prosesnya masih `up`, frame yang datang masih sah, auth masih bersih —
      # jadi keempat alarm lain di atas diam semua, dan satu-satunya yang tersisa
      # adalah dashboard, yang baru dibuka orang setelah ada keluhan.
      #
      # Penjaga `max_over_time(…[1h]) > 0` sengaja ada supaya aturan ini TIDAK
      # menyala pada deployment yang memang belum memakai jalur cepat (seperti
      # host ini selama WT belum terjangkau dari publik): "selalu nol sejak awal"
      # bukan penurunan. Penjaga laju WSS memastikan fallback memang sedang
      # melayani, jadi server yang sepi tidak menghasilkan alarm.
      #
      # `on()` pada tiga penggabung WAJIB, bukan gaya penulisan: seri paling kiri
      # membawa label milik gauge-nya, sedangkan penjaganya (`sum(…)`, `up{job=…}`)
      # tidak berlabel sama persis — pencocokan label default tidak akan menemukan
      # pasangan dan aturannya diam selamanya tanpa error apa pun.
      - alert: NyxTransportUnused
        expr: |
          max_over_time(nyx_transport_active_sessions[1h]) > 0
          and on() max_over_time(nyx_transport_active_sessions[15m]) == 0
          and on() sum(rate(nyx_wss_ingress_seconds_count[15m])) > 0
          and on() sum(up{job="nyx-sidecar"}) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Jalur WebTransport berhenti dipakai; fallback WSS yang melayani"
          description: "Sesi WebTransport pernah ada, lalu habis, sementara jalur WSS terus menerima trafik — dan prosesnya sendiri masih hidup. Keunggulan jalur cepat hilang tanpa satu pun error: klien sudah mundur ke WSS. Turun ke WSS bukan kegagalan (itu desainnya), jadi yang perlu dicari sebabnya: apakah handshake mulai gagal (lihat `nyx_transport_connections_total{result}`), auth menolak (panel auth gagal), atau WT tidak lagi terjangkau dari jaringan klien — dan perlu diingat CSP/`VITE_TRANSPORT_URL` memengaruhi ini."

  # ==========================================================================
  # Proses LOG Key Transparency (`nyx-kt-query-v2`, ML-DSA, pemilik LevelDB).
  #
  # Pembedaan yang wajib dipahami: grup `nyx-kt-auditor-v2` mengukur "apakah riwayat
  # ini bisa dipercaya", grup ini mengukur "apakah riwayat ini masih DITULIS dan
  # masih DISALIN". Kegagalan di sini juga **fail-open** — registrasi tetap
  # sukses, hanya tanpa jejak audit (docs/32) — jadi tidak ada satu pun error di
  # aplikasi yang menunjuk kemari.
  # ==========================================================================
  - name: nyx-kt-query-v2
    rules:
      - alert: NyxKtQueryDown
        expr: up{job="nyx-kt-query-v2"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Proses log Key Transparency (nyx-kt-query-v2) tidak bisa di-scrape"
          description: "Proses log mati/terputus. Registrasi & rotasi kunci TIDAK gagal (fail-open), tetapi tidak ada jejak audit baru — dan auditor akan mulai gagal membaca. Cek `systemctl status nyx-kt-query-v2`, journalctl -u nyx-kt-query-v2, leveldb, dan NYX_KT_V2_METRICS_ADDR (default 127.0.0.1:9468)."

      - alert: NyxKtQueryWriteFailing
        expr: increase(nyx_kt_query_writes_total{result="error"}[15m]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Penulisan ke log KT ditolak sisi log sendiri"
          description: "`Update` gagal DI DALAM proses log (bukan di jaringan antara nyx-api dan log — itu NyxKeyTransparencyWriteFailing). Penyebab tersering: leveldb penuh/read-only, atau token penerbit tidak cocok dengan issuer key log. Selama ini berlangsung, kunci baru tidak punya entri audit."

      # Kegagalan yang paling sunyi di seluruh sistem ini: snapshot lokal dibuat
      # oleh PROSES YANG SAMA (snapshot.go) pada irama harian, dan tidak ada
      # klien yang melihat efeknya. Bila prosesnya start ulang lebih sering dari
      # irama itu (atau timer-nya mati), arsipnya tidak pernah dibuat — dan itu
      # baru ketahuan ketika disk/leveldb hilang dan tidak ada yang bisa
      # dipulihkan (docs/10 §10.13).
      #
      # `absent_over_time` menutup kasus "belum pernah snapshot sama sekali";
      # sampel lama di dalam jendela 48 jam membuat restart normal tidak salah
      # alarm (kelas kesalahan yang sama dengan NyxSweeperStale/NyxKtAuditorHeadStale).
      - alert: NyxKtQuerySnapshotStalled
        expr: |
          time() - max(nyx_kt_query_snapshot_last_timestamp_seconds) > 48 * 3600
          or absent_over_time(nyx_kt_query_snapshot_last_timestamp_seconds[48h])
        for: 1h
        labels:
          severity: high
        annotations:
          summary: "Snapshot lokal log KT tidak dibuat >48 jam"
          description: "`nyx-kt-query-v2` belum menyelesaikan satu pun putaran snapshot dalam 48 jam (irama normal 24 jam). Cek NYX_KT_V2_SNAPSHOT_DIR / NYX_KT_V2_SNAPSHOT_INTERVAL, ruang disk, dan log proses (`snapshot`). Tanpa arsip lokal, `NyxKtSnapshotNotUploaded` di grup nyx-host juga akan menyusul — tetapi akar masalahnya di sini, bukan di kredensial R2."

      # Anchor `distinguished` = bukti "pohon ini dilihat pada waktu T" yang
      # membuat auditor lama bisa mengikat riwayat. Kalau putarannya berhenti
      # (timer mati setelah restart, atau layanan log menolak update-nya),
      # riwayat tetap tumbuh tetapi tanpa titik ikat yang segar.
      - alert: NyxKtQueryDistinguishedStalled
        expr: time() - max(nyx_kt_query_distinguished_timestamp_seconds) > 30 * 60
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Anchor `distinguished` di log KT tidak berputar >30 menit"
          description: "Timestamp anchor `distinguished` tidak lagi maju (irama normal 1 menit, dari `api.distinguished` di config log). Gauge-nya ditulis ulang setiap putaran yang BERHASIL, jadi seri yang diam berarti loop-nya berhenti atau penulisannya gagal terus — cek journalctl -u nyx-kt-query-v2 (cari \"kunci distinguished\") dan `api.distinguished` di config. Catatan cakupan: seri ini tidak ada pada deployment yang sengaja mematikan anchor (`distinguished: 0`), dan aturan ini tidak menyala untuk kasus itu."

      # Penjaga privasi sisi log — cermin NyxMetricsIdentityLeakAttempt.
      - alert: NyxKtQueryMetricsIdentityLeakAttempt
        expr: increase(nyx_kt_query_metrics_rejected_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ada percobaan mencatat metrik log KT dengan label identitas"
          description: "nyx_kt_query_metrics_rejected_total naik (reason={{ $labels.reason }}). Kode baru di server/kt-query mencoba mengirim nilai berbentuk identitas ke metrik; pemanggilnya harus diperbaiki (metrics.go akan selalu menolaknya)."

  - name: nyx-host
    rules:
      - alert: NyxHostDiskLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.12
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disk VPS < 12% tersisa"
          description: "Postgres + Redis AOF + log pm2 + (nanti) log KT. Bersihkan log lama atau besarkan volume."

      - alert: NyxHostMemoryPressure
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "RAM VPS > 90% terpakai"
          description: "Cek proses terbesar (pm2, Postgres). Argon2id 64MB per login + fan-out grup adalah puncak yang wajar."

      - alert: NyxRedisEvictingRateLimits
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Redis meng-evict key (rate limit bisa hilang)"
          description: "Key rate-limit harus selamat: pisahkan namespace rate limit ke DB logis/prefix dengan policy noeviction (docs/10 §10.11)."

      - alert: NyxRedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis tidak bisa di-scrape"
          description: "Realtime (pub/sub, presence, rate limit) bergantung penuh pada Redis."

      # [docs/30 WS-A / docs/32] Log Key Transparency harus terus menerima
      # tulisan; kegagalan berarti kunci baru tidak punya jejak audit. Hanya
      # menyala bila ADA percobaan tulis (jadi instance sepi tidak salah alarm).
      - alert: NyxKeyTransparencyWriteFailing
        expr: sum by (result) (increase(nyx_kt_writes_total{result="error"}[15m])) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Penulisan log Key Transparency gagal"
          description: "Cek proses KT v2 (leveldb) + KT_V2_SERVER_URL. Kegagalan tidak memblokir registrasi, jadi hanya terlihat dari sini (docs/32)."

      # [docs/38 §38.3 / docs/39 §39.5b] `result="invalid"` BUKAN insiden: ia
      # adalah cara sadar untuk MENOLAK menulis entri yang tidak bisa
      # diverifikasi. Dua sebab yang tercampur di label ini, dan artinya berbeda:
      #
      #   - perangkat lama tanpa `signingKeyV2` (`KT_V2_SIGNING_KEY_INVALID`).
      #     Akun itu tidak punya entri log yang ter-update — sampai perangkatnya
      #     merotasi ke kunci PQ. Ini **utang migrasi**, bukan bug.
      #   - input cacat (base64/hash rusak, panjang kunci salah) — bug klien atau
      #     percobaan menyuntikkan entri cacat.
      #
      # Karena itu alarmnya berbasis RASIO + ambang mutlak, bukan hitungan mentah:
      # satu login sesekali dari satu perangkat lama tidak boleh membangunkan
      # siapa pun, tetapi aliran yang persisten (>5% dari seluruh tulisan dan
      # minimal 3 kejadian dalam 6 jam) berarti perangkat PQ belum bergerak.
      # Ambang dipilih dari baseline self-host 2026-10-29: 37 tulisan `ok` dalam
      # 90 hari dan **nol** `invalid` sejak log v2 hidup — jadi 3 kejadian/6 jam
      # sudah di atas kebisingan normal, dan 5% menjaga agar volume `ok` yang
      # besar tidak menenggelamkan masalah yang nyata.
      #
      # Kenapa `and on()`: kedua sisi `sum()` tanpa label, jadi pencocokan label
      # default pun akan bekerja — `on()` ditulis eksplisit supaya tidak ada yang
      # menambahkan `by (result)` di salah satu sisi lalu mematikan aturannya
      # diam-diam (kelas cacat yang pernah terjadi di NyxKeyTransparencyStalled).
      - alert: NyxKeyTransparencyInvalidWrites
        expr: |
          sum(increase(nyx_kt_writes_total{result="invalid"}[6h])) >= 3
          and on() (
            sum(increase(nyx_kt_writes_total{result="invalid"}[6h]))
            / clamp_min(sum(increase(nyx_kt_writes_total[6h])), 1) > 0.05
          )
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Perangkat tanpa kunci PQ terus menulis (dilewati) ke log KT"
          description: "Lebih dari 5% tulisan KT dalam 6 jam dilewati sebagai `invalid` (≥3 kejadian). Penyebab tersering: perangkat lama tanpa `signingKeyV2` (ML-DSA-65) — akun itu tidak punya entri log yang ter-update sampai perangkat merotasi kunci (docs/38 §38.3). Kalau angkanya tidak turun dalam 7 hari, lihat opsi keputusan di docs/10 §10.23. `bash scripts/kt-invalid-report.sh` memecah sebabnya (perangkat vs input cacat) tanpa identitas."

      # Lonjakan mendadak = bug klien atau input cacat yang disuntikkan, bukan
      # utang migrasi: perangkat lama menulis paling banyak sekali per login.
      # Ambang 5 dalam 15 menit jauh di atas baseline (0 sepanjang riwayat log v2),
      # jadi tidak ada ambang yang bisa "capek" — ini hanya menyala pada burst.
      - alert: NyxKeyTransparencyInvalidSpike
        expr: sum(increase(nyx_kt_writes_total{result="invalid"}[15m])) >= 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Lonjakan tulisan KT yang dilewati (`invalid`)"
          description: "≥5 tulisan KT dilewati dalam 15 menit. Bedakan dari NyxKeyTransparencyInvalidWrites: yang ini burst, jadi tersangka utamanya klien yang mengirim bundle tanpa kunci ML-DSA-65 atau input cacat (bukan perangkat lama yang login sekali). Cek `[KT] Entri log dilewati … invalid: <reason>` di journal nyx-api dan `bash scripts/kt-invalid-report.sh`."

      # [drill 2026-10-14] DUA cacat ditemukan di sini, keduanya membuat aturan
      # ini MUSTAHIL menyala (dead rule):
      #
      #   1. `A and B` mencocokkan **label yang sama**. Sisi kiri
      #      (`increase(...{result="error"})`) punya label `result="error"`,
      #      sedangkan sisi kanan (`time() - nyx_kt_last_success_...`) TIDAK punya
      #      label → irisan selalu kosong → alert tidak pernah menyala. Karena itu
      #      sisi kiri diagregasi `sum()` agar labelnya sepadan (label-free).
      #   2. Gauge `last_success` hanya ada SETELAH satu tulisan sukses; instance
      #      yang belum pernah sukses (kasus paling gawat) membuat `time() -`
      #      atas seri kosong → tidak ada data. Ditutup dengan `absent_over_time`.
      - alert: NyxKeyTransparencyStalled
        expr: |
          sum(increase(nyx_kt_writes_total{result="error"}[1h])) > 0
          and (
            time() - max(nyx_kt_last_success_timestamp_seconds) > 3600
            or absent_over_time(nyx_kt_last_success_timestamp_seconds[1h])
          )
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Log KT gagal total selama 1 jam"
          description: "Semua percobaan tulis gagal tanpa satu pun sukses: kemungkinan binary KT mati atau endpoint salah. Kunci identitas baru tidak ter-audit."

      # [docs/10 §10.13] Snapshot log KT: tanpa salinan yang segar di luar VPS,
      # log hanya hidup di SATU disk. Yang diukur di sini adalah **umur arsip
      # terbaru yang ada di R2** (`…_remote_latest_timestamp_seconds`), bukan
      # jumlah unggahan: arsip dibuat harian oleh `nyx-kt-query-v2`, jadi umur di
      # atas 36 jam berarti cron mati, kredensial R2 rusak, atau snapshot lokal
      # berhenti dibuat. `increase(...{result="error"}) > 0` saja tidak cukup
      # (instance yang tidak pernah mencoba juga tidak pernah error), dan
      # `NyxKtSnapshotUploadFailing` di bawah hanya menangkap percobaan yang GAGAL.
      #
      # [drill 2026-10-16] Aturan sebelumnya memakai
      # `increase(nyx_kt_snapshot_upload_total{result="ok"}[36h]) == 0` dan
      # TERBUKTI menyala palsu di produksi (menyala 2026-10-16T10:18Z padahal R2
      # terisi 2026-10-15T20:30Z, cron berikutnya belum jatuh tempo). Sebabnya dua,
      # keduanya struktural:
      #
      #   1. RESTART. prom-client hanya membuat label-child saat `.inc()` pertama,
      #      jadi seri `{result="ok"}` hilang dari eksposisi setelah nyx-api
      #      restart. Sampel terakhir (2026-10-15T21:55Z) jadi basi, dan
      #      `increase()` atas seri basi = **0** → `== 0` benar.
      #   2. IDEMPOTEN. Jalur `skipped: already-uploaded` tidak menaikkan counter
      #      apa pun, jadi deployment yang R2-nya sudah selaras juga menghasilkan
      #      seri datar → alarm yang sama menyala tanpa ada yang salah.
      #
      # Gauge-nya diturunkan dari DAFTAR OBJEK R2 (bukan memori proses), jadi
      # kedua sebab itu hilang: nilainya benar setelah restart maupun setelah
      # unggahan yang dilewati. Gauge di-set hanya bila daftar bisa dibaca dan
      # memuat minimal satu stempel waktu (lihat `newestKtSnapshotRemoteSeconds`).
      #
      # `absent_over_time` tetap wajib: instance yang belum pernah bisa membaca R2
      # (kredensial salah sejak awal, bucket kosong) tidak punya seri sama sekali,
      # dan `time() - max(...)` atas vektor kosong = kosong → aturan diam
      # selamanya — justru skenario paling gawat.
      - alert: NyxKtSnapshotNotUploaded
        expr: |
          time() - max(nyx_kt_snapshot_remote_latest_timestamp_seconds) > 36 * 3600
          or absent_over_time(nyx_kt_snapshot_remote_latest_timestamp_seconds[36h])
        for: 1h
        labels:
          severity: high
        annotations:
          summary: "Arsip snapshot log KT di R2 tidak lebih baru dari 36 jam"
          description: "Umur arsip terbaru di R2 melewati 36 jam. Cek KT_SNAPSHOT_DIR di server NYX (cron 03:30 + log \"[KtSnapshot]\"), NYX_KT_V2_SNAPSHOT_DIR/NYX_KT_V2_SNAPSHOT_INTERVAL di nyx-kt-query-v2, dan kredensial R2. Log KT tanpa salinan segar di luar VPS = tidak ada pemulihan bila disk hilang (docs/10 §10.13)."

      - alert: NyxKtSnapshotUploadFailing
        expr: sum by (result) (increase(nyx_kt_snapshot_upload_total{result="error"}[24h])) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Unggahan snapshot log KT gagal"
          description: "Kredensial R2, bucket, atau berkas arsip bermasalah. Arsip lokal tetap ada (dipangkas 7), tetapi riwayat panjang di R2 berhenti bertambah."

      # [R11 2026-10-15] Guard anti-abuse default-nya `off`, jadi deployment
      # produksi yang lupa menyalakannya tampak 100% sehat: tidak ada error,
      # tidak ada penolakan — hanya saja tidak ada perlindungan sama sekali.
      # Gauge diset saat boot (server/src/index.ts), jadi ini alarm keadaan
      # konfigurasi, bukan alarm performa.
      #
      # `== 0` (bukan `absent`): deployment dev/tanpa exporter tidak punya seri
      # ini, dan itu memang bukan persoalan produksi — alarm tidak boleh menyala
      # hanya karena metriknya tidak ada.
      - alert: NyxAbuseGuardDisabled
        expr: min by (guard) (nyx_abuse_guard_enabled) == 0
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Guard anti-abuse ({{ $labels.guard }}) OFF di deployment ini"
          description: "Registrasi berjalan tanpa guard/attestation. Ini pilihan sah untuk dev, tapi di produksi berarti tidak ada batas burst per IP/instalasi/ASN. Set ABUSE_REGISTRATION_GUARD=on dan/atau ABUSE_REQUIRE_ATTESTATION=on lalu restart nyx-api; checklist lengkap di docs/10 \u00a710.16."

      # [audit 2026-10-27] `PP_SYNC_REQUIRED=1` adalah gate fail-closed: sync
      # anonim tanpa bukti sah dijawab 403. Kalau klien tidak bisa menerbitkan
      # bukti (issuer mati, kunci beda setelah rotasi, atau token tidak pernah
      # diisi), discovery grup mati sementara API tampak sehat — hanya 403 yang
      # tidak ada yang melihat. Rasio dipakai (bukan hitungan absolut) supaya
      # lonjakan sync sah tidak memicu alarm; `clamp_min` menjaga pembagian nol
      # saat belum ada trafik sama sekali.
      - alert: NyxPrivacyPassDenied
        expr: |
          (
            sum(rate(nyx_privacy_pass_total{route="sync",result="denied"}[10m]))
            /
            clamp_min(sum(rate(nyx_privacy_pass_total{route="sync"}[10m])), 1e-9)
          ) > 0.2
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Sync anonim ditolak Privacy Pass >20% selama 15 menit"
          description: "Gate PP_SYNC_REQUIRED menolak sync tanpa bukti sah. Periksa PP_ISSUER_PRIVATE_JWK (harus diset dan stabil antar worker/restart), rotasi kunci terakhir, dan nyx_privacy_pass_total{route=\"issue\"} — klien yang gagal menerbitkan bukti tidak akan pernah lolos. Prosedur di docs/10 \u00a710.22."

      # [docs/40 §40.6] Konsumen arsip riwayat gagal = pengguna kehilangan
      # riwayat yang sudah dijanjikan perangkat lama, DAN objek terenkripsi tetap
      # tinggal di R2 sampai TTL 30 menit / lifecycle rule 24 jam. Klien hanya
      # menulis `console.warn` pada kegagalan `consume` (impor tetap dianggap
      # sukses), jadi tanpa alarm ini kegagalannya tidak terlihat dari mana pun.
      #
      # Ambang `> 0` dalam 1 jam, bukan rasio: satu kegagalan konsumsi sudah
      # berarti satu arsip riwayat tertinggal, dan volume normalnya sangat kecil
      # (sekali pakai per link). `sum by (result)` menjaga bentuk label tetap
      # terlihat di notifikasi.
      - alert: NyxLinkHistoryConsumeFailing
        expr: sum by (result) (increase(nyx_link_history_ops_total{op="consume",result="error"}[1h])) > 0
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Konsumsi arsip riwayat perangkat hasil link gagal"
          description: "Endpoint POST /api/auth/link/history/consume mengembalikan error (bukan penolakan 4xx). Objek arsip sudah diimpor tetapi belum dihapus dari R2; periksa kredensial/bucket R2 dan Redis (state ter-seal) lewat log nyx-api. Arsip yatim dihapus lifecycle rule link-history/, tetapi pengguna yang gagal di sini tidak mendapat konfirmasi 'sekali pakai'."

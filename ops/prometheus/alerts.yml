#
# [docs/27 §27.7 + docs/30 WS-G] Alert untuk VPS NYX.
#
# Semua aturan di bawah HANYA memakai metrik event/host — tidak ada label yang
# memuat userId/usernameHash/IP (lihat server/src/utils/metrics.ts; penjaganya
# menolak nilai berbentuk identitas). Snapshot hierarki:
#
#   ops/prometheus/prometheus.yml   — konfigurasi scrape (loopback /metrics)
#   ops/prometheus/alerts.yml       — file ini
#
# Notifikasi: sambungkan via Alertmanager (`alertmanager.yml` di VPS, tidak di
# commit karena berisi token). Target respons: lihat docs/10 §10.12.

groups:
  - name: nyx-app
    rules:
      # Eksporter metrik mati = kita kehilangan seluruh visibilitas. Ini alarm
      # "buta", bukan alarm performa — makanya severity-nya tinggi.
      - alert: NyxMetricsExporterDown
        expr: up{job="nyx-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Exporter metrik nyx-api tidak bisa di-scrape"
          description: "Prometheus gagal scrape selama 5 menit. Cek proses pm2 nyx-api dan port loopback METRICS_PORT."

      # Penjaga privasi: nilai berbentuk identitas pernah dicoba masuk ke metrik.
      # Harus SELALU 0 di produksi.
      - alert: NyxMetricsIdentityLeakAttempt
        expr: increase(nyx_metrics_rejected_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ada percobaan mencatat metrik dengan label identitas"
          description: "nyx_metrics_rejected_total naik (reason={{ $labels.reason }}). Ada kode baru yang mencoba mengirim userId/usernameHash/IP/token ke metrik. Perbaiki pemanggilnya (server/src/utils/metrics.ts akan selalu menolak nilainya)."

      # Sweeper harian tidak jalan / gagal → data kedaluwarsa menumpuk
      # (token, session key, story, dead-man switch tidak tereksekusi).
      #
      # [drill 2026-10-14] Suku kedua dari `or` WAJIB: gauge ini hanya lahir
      # setelah satu putaran sweeper selesai (`sweepOnce` finally). Saat proses
      # baru (belum pernah menyapu) seri-nya TIDAK ADA, dan `time() - max(...)`
      # atas vektor kosong = kosong → alert diam. Skenario yang justru paling
      # penting (cron mati sejak boot / pm2 restart sebelum 00:00) tidak pernah
      # terdeteksi. `absent_over_time` menutupnya dan TIDAK false-positive saat
      # restart normal: sampel lama masih ada di dalam jendela 26 jam.
      - alert: NyxSweeperStale
        expr: |
          time() - max(nyx_sweeper_last_run_timestamp_seconds) > 26 * 3600
          or absent_over_time(nyx_sweeper_last_run_timestamp_seconds[26h])
        for: 30m
        labels:
          severity: high
        annotations:
          summary: "Sweeper sistem belum jalan >26 jam"
          description: "Cek pm2 nyx-api (cron in-process) dan log '[Cron]'."

      - alert: NyxSweeperFailed
        expr: increase(nyx_sweeper_duration_seconds_count{result="error"}[26h]) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Putaran sweeper sistem gagal"
          description: "Lihat log '[Cron] Gagal melakukan pembersihan database' — biasanya Postgres tak bisa dihubungi atau lock."

      - alert: NyxSweeperSlow
        expr: histogram_quantile(0.95, sum(rate(nyx_sweeper_duration_seconds_bucket[7d])) by (le)) > 120
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sweeper makin lambat (p95 > 120s)"
          description: "Biasanya indeks hilang atau tabel membengkak. Cek EXPLAIN pada query sweeper."

      # Blokir keamanan sesi melonjak = indikasi kloning sesi / device di-kick
      # massal / klien stuck di device lama.
      - alert: NyxSecurityBlocksSpike
        expr: increase(nyx_security_blocks_total[30m]) > 25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Blokir keamanan sesi/perangkat melonjak ({{ $labels.reason }})"
          description: "Periksa apakah ini pola kloning sesi, atau klien yang perlu re-auth setelah deploy."

  - name: nyx-host
    rules:
      - alert: NyxHostDiskLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.12
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disk VPS < 12% tersisa"
          description: "Postgres + Redis AOF + log pm2 + (nanti) log KT. Bersihkan log lama atau besarkan volume."

      - alert: NyxHostMemoryPressure
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "RAM VPS > 90% terpakai"
          description: "Cek proses terbesar (pm2, Postgres). Argon2id 64MB per login + fan-out grup adalah puncak yang wajar."

      - alert: NyxRedisEvictingRateLimits
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Redis meng-evict key (rate limit bisa hilang)"
          description: "Key rate-limit harus selamat: pisahkan namespace rate limit ke DB logis/prefix dengan policy noeviction (docs/10 §10.11)."

      - alert: NyxRedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis tidak bisa di-scrape"
          description: "Realtime (pub/sub, presence, rate limit) bergantung penuh pada Redis."

      # [docs/30 WS-A / docs/32] Log Key Transparency harus terus menerima
      # tulisan; kegagalan berarti kunci baru tidak punya jejak audit. Hanya
      # menyala bila ADA percobaan tulis (jadi instance sepi tidak salah alarm).
      - alert: NyxKeyTransparencyWriteFailing
        expr: increase(nyx_kt_writes_total{result="error"}[15m]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Penulisan log Key Transparency gagal"
          description: "Cek proses KT (leveldb) + KT_SERVER_URL. Kegagalan tidak memblokir registrasi, jadi hanya terlihat dari sini (docs/32)."

      # [drill 2026-10-14] DUA cacat ditemukan di sini, keduanya membuat aturan
      # ini MUSTAHIL menyala (dead rule):
      #
      #   1. `A and B` mencocokkan **label yang sama**. Sisi kiri
      #      (`increase(...{result="error"})`) punya label `result="error"`,
      #      sedangkan sisi kanan (`time() - nyx_kt_last_success_...`) TIDAK punya
      #      label → irisan selalu kosong → alert tidak pernah menyala. Karena itu
      #      sisi kiri diagregasi `sum()` agar labelnya sepadan (label-free).
      #   2. Gauge `last_success` hanya ada SETELAH satu tulisan sukses; instance
      #      yang belum pernah sukses (kasus paling gawat) membuat `time() -`
      #      atas seri kosong → tidak ada data. Ditutup dengan `absent_over_time`.
      - alert: NyxKeyTransparencyStalled
        expr: |
          sum(increase(nyx_kt_writes_total{result="error"}[1h])) > 0
          and (
            time() - max(nyx_kt_last_success_timestamp_seconds) > 3600
            or absent_over_time(nyx_kt_last_success_timestamp_seconds[1h])
          )
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Log KT gagal total selama 1 jam"
          description: "Semua percobaan tulis gagal tanpa satu pun sukses: kemungkinan binary KT mati atau endpoint salah. Kunci identitas baru tidak ter-audit."

      # [docs/10 §10.13] Snapshot log KT: tanpa unggahan yang sukses, log hanya
      # hidup di SATU disk. `increase(...{result="error"}) > 0` saja tidak cukup
      # (instance yang tidak pernah mencoba juga tidak pernah error), jadi
      # alarmnya adalah "tidak ada unggahan sukses selama 36 jam" — cukup longgar
      # untuk jadwal harian + retry, cukup ketat untuk menangkap cron mati.
      # [drill 2026-10-14] `increase(...) == 0` saja hanya bisa menyala bila
      # counter-nya SUDAH PERNAH ada; instance yang sejak boot tidak pernah
      # mencoba mengunggah (cron tidak jalan) menghasilkan vektor kosong → alert
      # tidak pernah menyala, padahal itu tepat skenario yang ingin ditangkap.
      # `absent_over_time` membuat "tidak ada unggahan sukses selama 36 jam"
      # benar untuk kedua bentuk: seri ada tapi datar, ATAU seri tidak ada.
      - alert: NyxKtSnapshotNotUploaded
        expr: |
          increase(nyx_kt_snapshot_upload_total{result="ok"}[36h]) == 0
          or absent_over_time(nyx_kt_snapshot_upload_total{result="ok"}[36h])
        for: 1h
        labels:
          severity: high
        annotations:
          summary: "Snapshot log KT tidak diunggah ke R2 selama 36 jam"
          description: "Cek KT_SNAPSHOT_DIR di server NYX, NYX_KT_SNAPSHOT_DIR di nyx-kt-query, dan kredensial R2. Log KT tanpa salinan di luar VPS = tidak ada pemulihan bila disk hilang (docs/10 §10.13)."

      - alert: NyxKtSnapshotUploadFailing
        expr: increase(nyx_kt_snapshot_upload_total{result="error"}[24h]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Unggahan snapshot log KT gagal"
          description: "Kredensial R2, bucket, atau berkas arsip bermasalah. Arsip lokal tetap ada (dipangkas 7), tetapi riwayat panjang di R2 berhenti bertambah."

      # [R11 2026-10-15] Guard anti-abuse default-nya `off`, jadi deployment
      # produksi yang lupa menyalakannya tampak 100% sehat: tidak ada error,
      # tidak ada penolakan — hanya saja tidak ada perlindungan sama sekali.
      # Gauge diset saat boot (server/src/index.ts), jadi ini alarm keadaan
      # konfigurasi, bukan alarm performa.
      #
      # `== 0` (bukan `absent`): deployment dev/tanpa exporter tidak punya seri
      # ini, dan itu memang bukan persoalan produksi — alarm tidak boleh menyala
      # hanya karena metriknya tidak ada.
      - alert: NyxAbuseGuardDisabled
        expr: nyx_abuse_guard_enabled == 0
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Guard anti-abuse ({{ $labels.guard }}) OFF di deployment ini"
          description: "Registrasi berjalan tanpa guard/attestation. Ini pilihan sah untuk dev, tapi di produksi berarti tidak ada batas burst per IP/instalasi/ASN. Set ABUSE_REGISTRATION_GUARD=on dan/atau ABUSE_REQUIRE_ATTESTATION=on lalu restart nyx-api; checklist lengkap di docs/10 \u00a710.13."

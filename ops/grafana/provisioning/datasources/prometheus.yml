# Datasource Prometheus untuk dashboard NYX (provisioning: tidak perlu klik).
#
# `uid: prometheus` WAJIB sama dengan `datasource.uid` di
# ops/grafana/dashboards/nyx-overview.json — kalau berbeda, semua panel kosong
# dengan pesan "Datasource not found" (dashboard diimpor sebagai JSON, jadi uid
# bukan pilihan bebas).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # Sama dengan scrape_interval ops/prometheus/prometheus.yml.
      timeInterval: 15s
      # Aturan alert hidup di Prometheus (file + `promtool test rules`), bukan di
      # Grafana — Grafana hanya menampilkan.
      manageAlerts: false
    editable: false

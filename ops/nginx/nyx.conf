# =========================================================
# 🏠 GLOBAL MIME TYPES
# =========================================================
include mime.types;
types {
    text/markdown md;
}

# =========================================================
# 🤖 AGENT DISCOVERY: Markdown for Agents Content Negotiation
# =========================================================
map $http_accept $serve_markdown {
    default     0;
    "~*text/markdown"  1;
}

# =========================================================
# 🛡️ CLOUDFLARE real_ip RESTORATION (H1/L1 remediation)
# ---------------------------------------------------------
# All traffic reaches this nginx through Cloudflare. Without
# this block $remote_addr is a CF edge IP, and any XFF we
# forward would be built on top of attacker-controllable
# input. Restoring the true client IP here lets every
# X-Forwarded-For below be a SINGLE CLEAN entry ($remote_addr),
# which pairs with Express `trust proxy` on the API side.
#
# ⚠️ VERIFY-AT-SYNC-TIME: these ranges rotate over time.
#    Re-fetch https://www.cloudflare.com/ips/ (v4 + v6)
#    immediately BEFORE syncing this file to the VPS and
#    update the list below if it changed.
#
# 📌 L1 NOTE (human/dashboard action, NOT configurable here):
#    rt.nyx-app.my.id (:33333 WebTransport sidecar) should be
#    fronted by a Cloudflare Tunnel or Spectrum instead of a
#    public origin A-record; afterwards remove the origin's
#    direct DNS exposure. See docs/10-deployment-ops.md.
# =========================================================
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# =========================================================
# 🏠 RUMAH 1: SISI PUBLIK / MARKETING (Domain Utama)
# =========================================================
server {
    # Loopback-only: traffic reaches nginx via cloudflared (same host).
    # Nothing on this IP is reachable directly except the rt QUIC sidecar.
    listen 127.0.0.1:3000;
    server_name nyx-app.my.id;

    # Folder khusus untuk Landing Page (hasil build dari folder marketing)
    root /var/www/nyx-marketing;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript application/x-javascript text/css text/plain image/svg+xml text/xml application/wasm application/octet-stream;

    set $marketing_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.cloudflarestorage.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';";

    # Agent Discovery Link Headers (RFC 8288)
    set $agent_links "</.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/mcp/server-card.json>; rel=\"service-meta\", </.well-known/openid-configuration>; rel=\"openid-configuration\", </.well-known/oauth-protected-resource>; rel=\"oauth-protected-resource\", </auth.md>; rel=\"service-meta\", </health>; rel=\"status\"";

    location / {
        # Markdown for Agents: serve index.md ONLY when root / is requested with Accept: text/markdown
        # Note: rewrite inside if is safe in nginx (unlike try_files)
        if ($serve_markdown) {
            rewrite ^/$ /index.md break;
        }

        try_files $uri $uri.html $uri/ =404;
        
        # Header cache agar HTML selalu fresh
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires "0";
        
        # --- FULL SECURITY HEADERS (MARKETING) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $marketing_csp always;
        add_header X-Edge-Relay "nyx-enigma" always;
        add_header X-Powered-By "NYX-Engine" always;
        
        # Agent discovery link headers
        add_header Link $agent_links always;
    }

    # Markdown for Agents: dedicated location for index.md
    location = /index.md {
        add_header Content-Type text/markdown;
        add_header x-markdown-tokens 1024;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|ico|webp)$ {
        expires 1y;
        
        # Header cache untuk aset statis marketing
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        # --- FULL SECURITY HEADERS (MARKETING) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $marketing_csp always;
        add_header X-Edge-Relay "nyx-enigma" always;
        add_header X-Powered-By "NYX-Engine" always;
        
        # Agent discovery link headers
        add_header Link $agent_links always;
    }

    # 📄 AGENT DOCS PAGE (un-shadowed)
    # Root cause: the prefix `location /api` swallowed /api-docs and proxied it
    # to Express (404 "Cannot GET"). Exact-match locations beat prefix matching,
    # so the Astro-built page is now served straight from disk.
    location = /api-docs {
        try_files /api-docs.html =404;

        # Header cache agar HTML selalu fresh
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires "0";

        # --- FULL SECURITY HEADERS (MARKETING) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $marketing_csp always;
        add_header X-Edge-Relay "nyx-enigma" always;
        add_header X-Powered-By "NYX-Engine" always;

        # Agent discovery link headers
        add_header Link $agent_links always;
    }

    # Trailing-slash variant: redirect to the canonical /api-docs URL
    location = /api-docs/ {
        return 301 /api-docs;
    }

    # 🔗 RELAY OHTTP PROSES TERPISAH (docs/37 P7, docs/10 §10.18)
    # Exact-match: harus di ATAS prefix `/api` agar tidak tertelan proxy API.
    # Relay sengaja TIDAK menerima X-Forwarded-For/X-Real-IP — ia hanya boleh
    # melihat koneksi, bukan identitas yang sudah ditegakkan edge.
    location = /api/ohttp/relay {
        proxy_pass http://ohttp-relay:4100/relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 8m;
        proxy_read_timeout 30s;
    }

    # 🔗 REVERSE PROXY UNTUK API
    location /api {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔗 WELL-KNOWN ENDPOINTS (Agent Discovery)
    location /.well-known {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🖼️ REVERSE PROXY UNTUK UPLOADS (ENCRYPTED ASSETS)
    location /uploads {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# =========================================================
# 🏛️ RUMAH 2: SISI APLIKASI UTAMA (Subdomain App)
# =========================================================
server {
    listen 127.0.0.1:3000;
    server_name app.nyx-app.my.id;

    # Folder aplikasi React utama Anda (hasil build dari folder web)
    root /var/www/nyx-web;
    index index.html;

    client_max_body_size 100M;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript application/x-javascript text/css text/plain image/svg+xml text/xml application/json application/octet-stream;

    # App CSP: script-src is strict — NO 'unsafe-inline', no CDN scripts.
    # The built index.html contains ZERO inline <script> (Vite emits external bundles;
    # PWA registerSW.js is external) and zero inline event handlers (the old
    # media="print" onload= font hack was removed from web/index.html).
    # 'wasm-unsafe-eval' MUST stay (libsodium WASM). style-src keeps 'unsafe-inline'
    # for the inline loader <style> block in index.html.
    # NOTE: rt.nyx-app.my.id (:33333) is expected to move behind a Cloudflare
    # Tunnel/Spectrum later — see the L1 note in the real_ip block above and
    # docs/10-deployment-ops.md.
    set $app_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://*.cloudflare.com https://api.nyx-app.my.id; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://cdn.jsdelivr.net https://*.cloudflarestorage.com https://app.nyx-app.my.id https://storage.nyx-app.my.id https://rt.nyx-app.my.id https://api.nyx-app.my.id; media-src 'self' data: blob: https://*.cloudflarestorage.com https://app.nyx-app.my.id https://storage.nyx-app.my.id https://rt.nyx-app.my.id https://api.nyx-app.my.id; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: https://api.nyx-app.my.id https://rt.nyx-app.my.id:33333 https://rt.nyx-app.my.id wss://api.nyx-app.my.id https://nyx-app.my.id wss://nyx-app.my.id https://*.cloudflarestorage.com https://storage.nyx-app.my.id https://app.nyx-app.my.id; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';";

    # Agent Discovery Link Headers (RFC 8288)
    set $agent_links_app "</.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/mcp/server-card.json>; rel=\"service-meta\", </.well-known/openid-configuration>; rel=\"openid-configuration\", </.well-known/oauth-protected-resource>; rel=\"oauth-protected-resource\", </auth.md>; rel=\"service-meta\", </health>; rel=\"status\"";

    # 🚀 SPA ROUTING (REACT ROUTER)
    location / {
        # Markdown for Agents: serve index.md ONLY when root / is requested with Accept: text/markdown
        # Note: rewrite inside if is safe in nginx (unlike try_files)
        if ($serve_markdown) {
            rewrite ^/$ /index.md break;
        }

        try_files $uri $uri/ /index.html;
        
        # Header cache HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires "0";

        # --- FULL SECURITY HEADERS (APP) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $app_csp always;
        
        add_header X-Edge-Relay "nyx-enigma" always;
        add_header X-Sec-Protocol "Double-Ratchet-Core" always;
        add_header X-Powered-By "NYX-Engine" always;
        
        # Agent discovery link headers
        add_header Link $agent_links_app always;
    }

    # 📦 CACHING UNTUK ASSETS REACT
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        
        # --- FULL SECURITY HEADERS (APP) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $app_csp always;
        
        add_header X-Edge-Relay "nyx-enigma" always;
        add_header X-Sec-Protocol "Double-Ratchet-Core" always;
        add_header X-Powered-By "NYX-Engine" always;
        
        # Agent discovery link headers
        add_header Link $agent_links_app always;
    }

    # 📡 SERVICE WORKER PWA
    location ~ ^/(sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;

        # --- FULL SECURITY HEADERS (APP) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $app_csp always;
        
        add_header X-Edge-Relay "nyx-enigma" always;
        add_header X-Sec-Protocol "Double-Ratchet-Core" always;
        add_header X-Powered-By "NYX-Engine" always;
        
        # Agent discovery link headers
        add_header Link $agent_links_app always;
    }

    # 🔗 RELAY OHTTP PROSES TERPISAH (docs/37 P7, docs/10 §10.18)
    # Exact-match: harus di ATAS prefix `/api` agar tidak tertelan proxy API.
    # Relay sengaja TIDAK menerima X-Forwarded-For/X-Real-IP — ia hanya boleh
    # melihat koneksi, bukan identitas yang sudah ditegakkan edge.
    location = /api/ohttp/relay {
        proxy_pass http://ohttp-relay:4100/relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 8m;
        proxy_read_timeout 30s;
    }

    # 🔗 REVERSE PROXY UNTUK API
    location /api {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔗 WELL-KNOWN ENDPOINTS (Agent Discovery)
    location /.well-known {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🖼️ REVERSE PROXY UNTUK UPLOADS (ENCRYPTED ASSETS)
    location /uploads {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
